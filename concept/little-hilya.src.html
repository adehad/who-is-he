<title>Little Hilya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one Hilya panel (basmala band, medallion, crescent, verse band) as the stage; chips and grown-up notes flow beneath it. */
:root {
  --bg: #e6f0ea;        /* marbled-paper mint */
  --panel: #fbfcf7;
  --ink: #1d3836;
  --muted: #566d69;
  --gold: #a87a22;
  --gold-soft: #f1e2bd;
  --rose: #c2577a;
  --lapis: #2b5888;
  --sage: #7fb096;
  --line: #cadfd3;
  --chip: #ffffff;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --ar: "Amiri", "Traditional Arabic", "Times New Roman", serif;
  --ar-display: "Aref Ruqaa", "Amiri", "Traditional Arabic", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111a2c; --panel: #19233d; --ink: #eef1e7; --muted: #a6b1c6;
    --gold: #e2b65a; --gold-soft: #3a3420; --rose: #ee93ad; --lapis: #92b7ea;
    --sage: #6fa489; --line: #2b385a; --chip: #212d4b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111a2c; --panel: #19233d; --ink: #eef1e7; --muted: #a6b1c6;
  --gold: #e2b65a; --gold-soft: #3a3420; --rose: #ee93ad; --lapis: #92b7ea;
  --sage: #6fa489; --line: #2b385a; --chip: #212d4b; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(60rem 30rem at 10% -10%, color-mix(in srgb, var(--sage) 22%, transparent), transparent 70%),
    radial-gradient(50rem 30rem at 110% 20%, color-mix(in srgb, var(--rose) 12%, transparent), transparent 70%);
  color: var(--ink);
  font: 17px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 18px; }
[lang="ar"] { font-family: var(--ar); direction: rtl; }
a { color: var(--lapis); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--lapis); outline-offset: 3px; border-radius: 8px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font: 800 1.7rem/1 var(--display); margin: 0; letter-spacing: -0.01em; }
.brand span { font: 700 1.5rem/1 var(--ar-display); color: var(--gold); }
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.95rem; color: var(--muted); user-select: none; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.switch { width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .2s; }
.toggle input:checked + .switch { background: var(--lapis); }
.toggle input:checked + .switch::after { transform: translateX(18px); }
.toggle input:focus-visible + .switch { outline: 3px solid var(--lapis); outline-offset: 2px; }

/* Station index */
.index {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin;
  scroll-snap-type: x proximity; scroll-padding-inline: 24px; overscroll-behavior-x: contain;
}
.index button {
  flex: none; scroll-snap-align: center; display: inline-flex; align-items: center; gap: 8px;
  border: 2px solid var(--line); background: var(--chip); border-radius: 99px;
  padding: 6px 14px 6px 8px; cursor: pointer; font: 600 0.95rem/1.2 var(--display);
}
.index .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; background: var(--line); color: var(--muted); }
.index button.seen .dot { background: var(--gold-soft); color: var(--gold); }
.index button[aria-current="step"] { border-color: var(--gold); }
.index button[aria-current="step"] .dot { background: var(--gold); color: var(--panel); }

/* Hilya panel */
.hilya {
  background: var(--panel);
  border-radius: 28px;
  padding: 10px;
  box-shadow: 0 10px 30px -12px color-mix(in srgb, var(--ink) 30%, transparent);
  position: relative;
}
.hilya-inner {
  border: 2px solid var(--gold);
  outline: 1px solid var(--gold); outline-offset: -8px;
  border-radius: 22px;
  padding: 18px 18px 14px;
  display: grid; justify-items: center; gap: 6px; text-align: center;
  position: relative; overflow: hidden;
}
.corner { position: absolute; width: 26px; height: 26px; color: var(--gold); opacity: .45; }
.corner svg { width: 100%; height: 100%; display: block; }
.c1 { top: 14px; left: 14px; } .c2 { top: 14px; right: 14px; } .c3 { bottom: 14px; left: 14px; } .c4 { bottom: 14px; right: 14px; }
.basmala { font: 400 1.25rem/1.6 var(--ar); color: var(--muted); }
.medallion {
  width: min(250px, 66vw); aspect-ratio: 1; max-width: 100%;
  border-radius: 50%;
  border: 3px solid var(--gold);
  box-shadow: inset 0 0 0 7px var(--panel), inset 0 0 0 9px var(--gold-soft);
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--gold-soft) 70%, var(--panel)), var(--panel) 72%);
  display: grid; place-items: center; align-content: center; gap: 2px;
  padding: 26px;
}
.medallion svg { width: 52%; height: auto; overflow: visible; }
/* Progress: one dot per station (after the intro) in a ring just outside the medallion, clockwise from the top. */
.medal-wrap { position: relative; padding: 11px; }
.ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.ring circle { fill: var(--line); transition: fill .4s; }
.ring circle.seen { fill: var(--gold); }
.ring circle.now { fill: var(--rose); }
.phrase { font: 700 clamp(1.25rem, 4.6vw, 1.6rem)/1.8 var(--ar); color: var(--ink); text-wrap: balance; }
.crescent { width: min(290px, 76vw); height: 26px; margin-top: -19px; color: var(--gold); }
.crescent svg { width: 100%; height: 100%; display: block; }
.station-name { font: 700 .8rem/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--rose); margin-top: 2px; }
.kid-title { font: 800 clamp(1.6rem, 6vw, 2.2rem)/1.1 var(--display); margin: 2px 0 0; text-wrap: balance; }
.kid-line { font-size: 1.12rem; max-width: 34ch; margin: 4px 0 6px; text-wrap: pretty; }
.verse { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 6px; width: 100%; display: grid; gap: 0; }
.verse [lang="ar"] { font-size: 1.2rem; color: var(--gold); }
.verse small { color: var(--muted); font-size: .82rem; }

/* Enter animation */
.stage.enter .medallion { animation: medIn .7s cubic-bezier(.2,.9,.25,1.2) both; }
.stage.enter .kid-title, .stage.enter .kid-line, .stage.enter .station-name { animation: rise .55s ease both; }
.stage.enter .kid-line { animation-delay: .08s; }
@keyframes medIn { from { transform: scale(.7) rotate(-25deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Icon idle motion */
.i-spin { transform-origin: 60px 60px; animation: spin 60s linear infinite; }
.i-glow { animation: glow 4s ease-in-out infinite; }
.i-twinkle { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.i-twinkle:nth-of-type(2) { animation-delay: .8s; } .i-twinkle:nth-of-type(3) { animation-delay: 1.6s; }
.i-sway { transform-origin: 60px 112px; animation: sway 6s ease-in-out infinite; }
.i-drop { animation: fall 1.8s ease-in infinite; }
.i-drop:nth-of-type(2) { animation-delay: .6s; } .i-drop:nth-of-type(3) { animation-delay: 1.2s; }
.i-spark { animation: float 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.i-spark:nth-of-type(2) { animation-delay: 1s; } .i-spark:nth-of-type(3) { animation-delay: 2s; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes glow { 50% { opacity: .55; } }
@keyframes twinkle { 50% { transform: scale(.4); opacity: .4; } }
@keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(3deg); } }
@keyframes fall { 0% { transform: translateY(-4px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
@keyframes float { 0% { transform: translateY(6px) scale(.6); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-22px) scale(1); opacity: 0; } }
/* Also stopped by the reduced-motion rule at the end. */
.i-flow { animation: flow 1.6s linear infinite; }
.i-bob { animation: bob 4s ease-in-out infinite; }
.i-bob:nth-of-type(2) { animation-delay: -1.3s; } .i-bob:nth-of-type(3) { animation-delay: -2.6s; }
.i-ripple { transform-box: fill-box; transform-origin: center; animation: ripple 3s ease-out infinite; }
.i-ripple:nth-of-type(2) { animation-delay: 1s; } .i-ripple:nth-of-type(3) { animation-delay: 2s; }
@keyframes flow { to { stroke-dashoffset: -18; } }
@keyframes bob { 50% { transform: translate(6px, -2px); } }
@keyframes ripple { 0% { transform: scale(.15); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(1); opacity: 0; } }

/* Chips */
.chips { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.chip {
  border: 2px solid var(--line); background: var(--chip); border-radius: 18px;
  padding: 10px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  font: 700 1rem/1.2 var(--display);
}
.chip .n { font: 700 .75rem/1 var(--body); background: var(--line); color: var(--muted); border-radius: 99px; padding: 3px 7px; }
.chip[aria-selected="true"] { border-color: var(--ink); background: var(--ink); color: var(--panel); }
.chip[aria-selected="true"] .n { background: var(--panel); color: var(--ink); }
.chip.c-char { --tint: var(--sage); } .chip.c-sign { --tint: var(--gold); } .chip.c-mirror { --tint: var(--lapis); }
.chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--tint); }

/* Cards */
.cards { display: grid; gap: 12px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  padding: 14px 16px; display: grid; gap: 6px; min-width: 0;
}
.card h3 { margin: 0; font: 700 1.2rem/1.25 var(--display); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card p { margin: 0; }
.card.research { border-style: dashed; background: transparent; }
.card.mirror { border-color: var(--lapis); border-style: dashed; }
.pill { font: 700 .7rem/1 var(--body); letter-spacing: .08em; text-transform: uppercase; border-radius: 99px; padding: 5px 9px; border: 1.5px solid currentColor; }
.k-mujiza { color: var(--gold); } .k-karama { color: var(--rose); } .k-khasisa { color: var(--lapis); }
.k-research { color: var(--muted); } .k-trait { color: var(--sage); }
.k-explain { color: var(--muted); font-size: .9rem; }
.group { display: grid; gap: 10px; }
.group + .group { margin-top: 8px; }
.group-head { margin: 0; }
.group > .k-explain { margin: -4px 0 0; }

/* Grown-up layer */
.adult { display: none; }
.grown .adult { display: grid; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: .88rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 2px; }
.badge { font: 700 .68rem/1 var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; background: var(--line); color: var(--ink); }
.badge.draft { background: var(--gold-soft); color: var(--gold); }
.badge.weak { background: transparent; color: var(--rose); box-shadow: inset 0 0 0 1.5px var(--rose); }
.cite { font-weight: 700; }
details { font-size: .95rem; }
details summary { cursor: pointer; color: var(--lapis); font-weight: 700; }
.src { display: grid; gap: 8px; padding-top: 8px; }
.src [lang="ar"] { font-size: 1.15rem; line-height: 1.9; }
.src .en { color: var(--ink); }
.note { font-size: .88rem; color: var(--rose); }
.adult-section { gap: 10px; }
.adult-section h2 { font: 800 1.3rem/1.2 var(--display); margin: 6px 0 0; }
.quote { display: grid; gap: 4px; }
.quote [lang="ar"] { font-size: 1.35rem; font-weight: 700; line-height: 1.95; }
.banner {
  border: 1.5px solid var(--gold); background: var(--gold-soft); color: var(--ink);
  border-radius: 14px; padding: 10px 14px; font-size: .92rem;
}

/* Footer nav */
.nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.nav button {
  border: 0; border-radius: 16px; padding: 12px 20px; cursor: pointer;
  font: 800 1.05rem/1 var(--display); background: var(--ink); color: var(--panel);
}
.nav button:disabled { opacity: .35; cursor: default; }
.nav .back { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.count { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.footnote { color: var(--muted); font-size: .85rem; text-align: center; }

/* Mode switch (Learn | Story) and the story's own segmented controls */
.seg { display: inline-flex; padding: 3px; gap: 2px; border: 2px solid var(--line); background: var(--chip); border-radius: 99px; }
.seg button {
  border: 0; background: transparent; border-radius: 99px; padding: 6px 16px; cursor: pointer;
  font: 700 .95rem/1.2 var(--display); color: var(--muted); transition: background .25s, color .25s;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.mode { display: grid; gap: 18px; min-width: 0; }
.mode[hidden] { display: none; }
.mode.enter { animation: rise .45s ease both; }

/* Story progress: one dot per beat, a little gap between the four parts */
.trail { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 1px; }
.trail button { width: 14px; height: 22px; border: 0; padding: 0; background: none; cursor: pointer; display: grid; place-items: center; }
.trail button::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--line); transition: background .4s, transform .3s; }
.trail button.seen::before { background: var(--gold); }
.trail button[aria-current="step"]::before { background: var(--rose); transform: scale(1.5); }
.trail .gap { width: 8px; }
.trail .start::before { border-radius: 2px; transform: rotate(45deg); }

/* Story scene: the child in a round mirror (morning, night) or a rounded window (breakfast, outside) */
.scene { position: relative; overflow: hidden; isolation: isolate; margin-bottom: 4px; }
.scene::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3; }
.scene.mirror {
  width: min(250px, 66vw); aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--gold);
  background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--gold-soft) 70%, var(--panel)), var(--panel) 72%);
}
.scene.mirror::after { box-shadow: inset 0 0 0 7px var(--panel), inset 0 0 0 9px var(--gold-soft); }
.scene.mirror.night { background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--lapis) 26%, var(--panel)), color-mix(in srgb, var(--lapis) 8%, var(--panel)) 75%); }
.scene.window { width: min(300px, 78vw); aspect-ratio: 5 / 4; border-radius: 26px; border: 3px solid var(--gold); background: var(--panel); }
.scene.window::after { box-shadow: inset 0 0 0 5px var(--panel), inset 0 0 0 7px var(--gold-soft); }
.scene svg { display: block; overflow: visible; }
.scene .back, .scene .front { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene .front { z-index: 1; top: auto; height: 22%; }
.window.bd-table .prop { bottom: 12%; }
.scene .child { position: absolute; z-index: 0; }
.scene .prop { position: absolute; z-index: 2; }
.mirror .child { left: 6%; bottom: 3%; width: 64%; }
.mirror.solo .child { left: 18%; }
.mirror .prop { right: 9%; bottom: 22%; width: 33%; }
.window .child { left: 7%; bottom: -2%; width: 54%; }
.window .prop { right: 7%; bottom: 9%; width: 32%; }

/* The child: colours come from the picker via custom properties on #story */
#story { --skin: #d39a6a; --feat: #3b2215; --hair: #2b1b12; --cover: var(--lapis); --shirt: var(--sage); --kufi: #f7f2e4; }
#story[data-cover="hijab"] .cv-kufi, #story[data-cover="hijab"] .cv-bare,
#story[data-cover="kufi"] .cv-hijab, #story[data-cover="none"] .cv-hijab, #story[data-cover="none"] .cv-kufi { display: none; }
.kid-bob { animation: breathe 5s ease-in-out infinite; }
.kid-head { transform-origin: 60px 88px; animation: tilt 9s ease-in-out infinite; }
@keyframes breathe { 50% { transform: translateY(-1.6px); } }
@keyframes tilt { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2.5deg); } }

/* Prop idle motion (plus the shared i-* classes above) */
.p-scrub { animation: scrub 1.4s ease-in-out infinite; }
.p-swing { transform-origin: 60px 14px; animation: sway 5s ease-in-out infinite; }
.p-rock { transform-origin: 60px 60px; animation: rock 4s ease-in-out infinite; }
.p-up { animation: up 2.4s ease-in-out infinite; }
.p-beat { transform-origin: 60px 72px; animation: beat 2.2s ease-in-out infinite; }
.p-tap { transform-origin: 70px 92px; animation: tap 2.6s ease-in-out infinite; }
.p-hop { animation: hop 2.8s ease-in-out infinite; }
.p-float { animation: up 3.6s ease-in-out infinite; }
.p-glide { animation: scrub 3.2s ease-in-out infinite; }
@keyframes scrub { 50% { transform: translateX(-7px); } }
@keyframes rock { 0%, 100% { transform: rotate(-18deg); } 50% { transform: rotate(18deg); } }
@keyframes up { 50% { transform: translateY(-5px); } }
@keyframes beat { 0%, 60%, 100% { transform: none; } 15% { transform: scale(1.08); } 30% { transform: scale(.98); } 45% { transform: scale(1.05); } }
@keyframes tap { 0%, 70%, 100% { transform: none; } 80% { transform: rotate(-9deg); } 90% { transform: none; } }
@keyframes hop { 0%, 60%, 100% { transform: none; } 70% { transform: translateY(-9px); } 80% { transform: none; } 88% { transform: translateY(-4px); } }
@keyframes popIn { from { transform: scale(.4) translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes sceneIn { from { transform: scale(.88); opacity: 0; } to { transform: none; opacity: 1; } }

.story-stage.enter .scene.mirror { animation: medIn .7s cubic-bezier(.2,.9,.25,1.2) both; }
.story-stage.enter .scene.window { animation: sceneIn .6s cubic-bezier(.2,.9,.25,1.15) both; }
.story-stage.enter .prop { animation: popIn .55s .35s cubic-bezier(.2,.9,.25,1.3) both; }
.story-stage.enter .station-name, .story-stage.enter .kid-title, .story-stage.enter .kid-line, .story-stage.enter .prompt, .story-stage.enter .links { animation: rise .55s ease both; }
.story-stage.enter .kid-line { animation-delay: .08s; }
.story-stage.enter .prompt { animation-delay: .16s; }
.story-stage.enter .links { animation-delay: .24s; }

.greet { font: 800 1.05rem/1.2 var(--display); color: var(--gold); margin: 0; }
.story-stage .kid-line { margin: 0; }
.story-stage .kid-line + .kid-line { margin-top: 4px; }
.prompt {
  display: flex; gap: 10px; align-items: flex-start; text-align: left; max-width: 36ch; margin: 8px 0 2px;
  border: 1.5px dashed var(--lapis); border-radius: 16px; padding: 10px 14px; font-size: 1.02rem;
}
.prompt::before { content: ""; flex: none; width: 16px; height: 20px; margin-top: 3px; border-radius: 50%; border: 2.5px solid var(--gold); background: var(--gold-soft); }
.prompt ul { margin: 0; padding-left: 18px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; }
.go-link {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  border: 2px solid var(--line); background: var(--chip); border-radius: 99px;
  padding: 5px 14px 5px 6px; font: 700 .92rem/1.2 var(--display); transition: border-color .2s;
}
.go-link:hover { border-color: var(--gold); }
.saw { font: 400 1.35em/1 var(--ar); }
.mini { width: 28px; height: 28px; border-radius: 50%; background: var(--gold-soft); display: grid; place-items: center; flex: none; }
.mini svg { width: 22px; height: 22px; display: block; }
.mini svg * { animation: none !important; }
.recap { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; max-width: 380px; margin-top: 8px; }
.recap button {
  width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); background: radial-gradient(circle at 50% 40%, var(--gold-soft), var(--panel) 80%);
  padding: 6px; cursor: pointer; transition: transform .2s;
}
.recap button:hover { transform: translateY(-2px); }
.recap svg { width: 100%; height: 100%; display: block; }
.recap svg * { animation: none !important; }
.story-stage.enter .recap button { animation: popIn .45s cubic-bezier(.2,.9,.25,1.3) both; animation-delay: calc(.3s + var(--k) * 45ms); }

/* Picker */
.picker { display: grid; gap: 14px; justify-items: center; width: 100%; max-width: 420px; margin-top: 6px; }
.picker fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; justify-items: center; min-width: 0; }
.picker legend, .picker label > span { font: 700 .8rem/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 0; margin-bottom: 8px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.swatches button {
  width: 38px; height: 38px; border-radius: 50%; cursor: pointer; background: var(--sw);
  border: 3px solid var(--panel); box-shadow: 0 0 0 2px var(--line); transition: box-shadow .2s, transform .2s;
}
.swatches button[aria-checked="true"] { box-shadow: 0 0 0 3px var(--gold); transform: scale(1.08); }
.picker label { display: grid; justify-items: center; }
.picker input[type="text"] {
  font: 700 1.1rem/1.2 var(--display); color: var(--ink); background: var(--chip); text-align: center;
  border: 2px solid var(--line); border-radius: 14px; padding: 8px 14px; width: min(240px, 70vw);
}
.picker input[type="text"]:focus { border-color: var(--gold); outline: none; }
.start-btn { border: 0; border-radius: 16px; padding: 12px 22px; cursor: pointer; font: 800 1.05rem/1 var(--display); background: var(--ink); color: var(--panel); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

function cite(ref) {
  const t = TEXTS[ref];
  const [col, n] = ref.split(":");
  // t.sunnah is the real sunnah.com reference, matched by Arabic text (scripts/match_sunnah.py).
  const num = t.sunnah ? t.sunnah.ref.split(":")[1] : n;
  const url = t.sunnah ? `https://sunnah.com/${t.sunnah.ref}` : `https://sunnah.com/${col}/${t.ch}`;
  const grade = t.sunnah?.grade ?? null;
  if (col === "shamail") return { label: `Shamāʾil ${num} (ch. ${t.ch})`, url, exact: !!t.sunnah, grade };
  const b = BOOKS[col] ?? { name: col };
  const book = b.books?.[t.ch] ?? t.ch_en ?? "Book";
  return { label: `${b.name}, ${book} (${t.ch}): ${num}`, url, exact: !!t.sunnah, grade };
}

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}

function sourceBlock(ref, extra = []) {
  const c = cite(ref), t = TEXTS[ref];
  return h("div", { class: "meta" },
    h("a", { class: "cite", href: c.url, target: "_blank", rel: "noopener" }, c.label),
    c.exact ? null : h("span", {}, "(opens the book; number to verify)"),
    c.grade ? h("span", { class: `badge ${/da.?if/i.test(c.grade) ? "weak" : ""}`, title: "Grade as shown on sunnah.com" }, c.grade) : null,
    ...extra,
    t.corrected ? h("span", { class: "badge" }, "Translation corrected") : null,
    h("span", { class: "badge draft" }, "Draft"),
    h("details", { style: "flex-basis:100%" },
      h("summary", {}, "Read the full hadith"),
      h("div", { class: "src" },
        h("p", { lang: "ar" }, t.ar),
        h("p", { class: "en" }, h("strong", {}, t.narrator), " ", t.en),
        ...(t.corrected ?? []).map(c => h("p", { class: "note" },
          `We corrected the dataset English: “${c.original}” → “${c.replacement}”. `, c.reason)),
        h("small", {}, `Chapter: ${t.ch_en} · `, h("span", { lang: "ar" }, t.ch_ar))
      )
    )
  );
}

const state = { i: 0, tab: "char", seen: new Set([0]) };
const $ = id => document.getElementById(id);

function renderIndex() {
  $("index").replaceChildren(...STATIONS.map((s, i) =>
    h("button", {
      class: state.seen.has(i) ? "seen" : "",
      "aria-current": i === state.i ? "step" : null,
      onclick: null
    }, h("span", { class: "dot" }, i === 0 ? "★" : String(i)), s.name)
  ));
  [...$("index").children].forEach((b, i) => b.addEventListener("click", () => go(i)));
  $("index").children[state.i]?.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
}

function renderRing() {
  const n = STATIONS.length - 1;
  $("ring").innerHTML = STATIONS.slice(1).map((_, k) => {
    const a = 2 * Math.PI * k / n, i = k + 1;
    const cls = i === state.i ? "now" : state.seen.has(i) ? "seen" : "";
    return `<circle class="${cls}" cx="${(50 + 48.4 * Math.sin(a)).toFixed(2)}" cy="${(50 - 48.4 * Math.cos(a)).toFixed(2)}" r="${i === state.i ? 1.7 : 1.2}"/>`;
  }).join("");
}

function renderStage(animate) {
  const s = STATIONS[state.i];
  $("icon").innerHTML = ICONS[s.icon];
  $("phrase").textContent = s.phrase;
  $("sname").textContent = s.name;
  $("ktitle").textContent = s.title;
  $("kline").textContent = s.line;
  renderRing();
  if (animate) {
    const st = $("stage");
    st.classList.remove("enter"); void st.offsetWidth; st.classList.add("enter");
  }
}

function renderChips() {
  const s = STATIONS[state.i];
  const tabs = [
    { id: "char", label: "Character", n: s.character.length, cls: "c-char" },
    { id: "sign", label: "Special signs", n: s.signs.length, cls: "c-sign" },
    { id: "mirror", label: "Mirror", n: null, cls: "c-mirror" }
  ];
  $("chips").replaceChildren(...tabs.map(t => {
    const b = h("button", { class: `chip ${t.cls}`, role: "tab", "aria-selected": String(state.tab === t.id) },
      t.label, t.n != null ? h("span", { class: "n" }, String(t.n)) : null);
    b.addEventListener("click", () => { state.tab = t.id; renderChips(); renderCards(); });
    return b;
  }));
  $("chips").hidden = state.i === 0;
}

function renderCards() {
  const s = STATIONS[state.i];
  const box = $("cards");
  if (state.i === 0) {
    box.replaceChildren(h("div", { class: "card" },
      h("h3", {}, "How it works"),
      h("p", {}, "Each stop starts with how he looked, as his Companions described him. Then tap the buttons to see the good character it reminds us of, the special signs Allah gave him, and a little mirror challenge for you."),
      h("p", { class: "k-explain" }, "Following the order of Imam al-Tirmidhī’s book al-Shamāʾil al-Muḥammadiyya.")
    ));
    return;
  }
  let cards = [];
  if (state.tab === "char") {
    cards = s.character.map(c => h("article", { class: "card" },
      h("h3", {}, h("span", { class: "pill k-trait" }, c.trait)),
      h("p", {}, c.line),
      h("div", { class: "adult" }, c.note ? h("p", { class: "note" }, c.note) : null, sourceBlock(c.ref, [h("span", { class: "badge" }, c.basis === "classical" ? "Classical link" : "Our reflection")]))
    ));
    if (!cards.length) cards = [h("article", { class: "card research" },
      h("h3", {}, h("span", { class: "pill k-research" }, KINDS.research.label)),
      h("p", {}, "We are still looking for checked reports that link this to his character."))];
  } else if (state.tab === "sign") {
    cards = Object.keys(KINDS).flatMap(kind => {
      const group = s.signs.filter(g => g.kind === kind);
      if (!group.length) return [];
      return [h("div", { class: "group" },
        h("h3", { class: "group-head" }, h("span", { class: `pill k-${kind}` }, KINDS[kind].label)),
        h("p", { class: "k-explain" }, KINDS[kind].explain),
        ...group.map(g => h("article", { class: `card ${kind === "research" ? "research" : ""}` },
          h("h3", {}, g.title),
          h("p", {}, g.line),
          g.trait ? h("p", { class: "k-explain" }, `Reminds us he was ${g.trait.toLowerCase()}.`) : null,
          g.ref ? h("div", { class: "adult" }, g.note ? h("p", { class: "note" }, g.note) : null, sourceBlock(g.ref, [h("span", { class: "badge" }, "Category: ours")])) : null
        ))
      )];
    });
  } else {
    cards = [h("article", { class: "card mirror" },
      h("h3", {}, h("span", { class: "pill k-khasisa" }, "Mirror"), "Coming soon"),
      h("p", {}, s.mirror),
      h("p", { class: "k-explain" }, "Placeholder for the mirror story: a child looking at themselves from head to toe.")
    )];
  }
  box.replaceChildren(...cards);
}

function renderAdult() {
  const s = STATIONS[state.i];
  $("adult").replaceChildren(
    h("div", { class: "banner" }, "Draft. Awaiting scholarly review. Links to character are our own reflections unless marked “Classical link”, and sign categories are ours unless a source states one."),
    h("h2", {}, "What the Companions described"),
    ...s.physical.map(p => h("article", { class: "card quote" },
      h("p", { lang: "ar" }, p.phrase),
      p.gloss ? h("p", {}, p.gloss) : null,
      p.note ? h("p", { class: "note" }, p.note) : null,
      sourceBlock(p.ref)
    )),
    h("p", { class: "k-explain" }, "Numbers, links and grades are sunnah.com’s, matched to our copy of each text. Some detailed descriptions in the Shamāʾil have a weak (ḍaʿīf) chain. Many scholars accept such reports for describing his appearance and manners, while others are stricter, so the grade is shown for grown-ups to weigh.")
  );
}

function render(animate = false) {
  renderIndex(); renderStage(animate); renderChips(); renderCards(); renderAdult();
  $("back").disabled = state.i === 0;
  $("next").disabled = state.i === STATIONS.length - 1;
  $("next").textContent = state.i === 0 ? "Begin" : "Next";
  $("count").textContent = state.i === 0 ? "Start" : `${state.i} of ${STATIONS.length - 1}`;
}

function go(i) {
  if (i < 0 || i >= STATIONS.length || i === state.i) return;
  state.i = i; state.seen.add(i); state.tab = "char";
  render(true);
}

/* ---- Story mode ---- */

const story = { i: 0, seen: new Set([0]), child: { skin: 2, cover: "hijab", name: "" } };
try {
  const c = JSON.parse(localStorage.getItem("child") ?? "null");
  if (SKINS[c?.skin]) story.child.skin = c.skin;
  if (COVERS.some(v => v.id === c?.cover)) story.child.cover = c.cover;
  if (typeof c?.name === "string") story.child.name = c.name.slice(0, 20);
} catch {}
let mode = "learn";
try { if (localStorage.getItem("mode") === "story") mode = "story"; } catch {}

const stationById = id => STATIONS.find(s => s.id === id);
const shortName = s => s.name.replace(/^(His|The) /, "").toLowerCase();
const withName = str => str.replace("{name}", story.child.name.trim() || "you");
const raw = (tag, attrs, html) => { const el = h(tag, attrs); el.innerHTML = html; return el; };
const corners = () => ["c1", "c2", "c3", "c4"].map(c => raw("span", { class: `corner ${c}` }, CORNER));

function applyChild() {
  const el = $("story"), sk = SKINS[story.child.skin];
  el.style.setProperty("--skin", sk.skin);
  el.style.setProperty("--feat", sk.feat);
  el.dataset.cover = story.child.cover;
  try { localStorage.setItem("child", JSON.stringify(story.child)); } catch {}
}

function scene(b) {
  const part = PARTS[b.part], key = b.backdrop ?? part.backdrop, bd = BACKDROPS[key];
  const cls = bd ? `window bd-${key}` : `mirror${part.night ? " night" : ""}${b.prop ? "" : " solo"}`;
  return raw("div", { class: `scene ${cls}`, "aria-hidden": "true" },
    (bd?.back ?? "") + CHILD + (bd?.front ?? "") + (b.prop ? `<div class="prop">${PROPS[b.prop]}</div>` : ""));
}

function openStation(id) {
  const i = STATIONS.findIndex(s => s.id === id);
  if (i < 0) return;
  state.i = i; state.seen.add(i); state.tab = "char";
  setMode("learn");
}

function pickerView() {
  const swatches = SKINS.map((s, k) => {
    const b = h("button", { type: "button", role: "radio", "aria-checked": String(k === story.child.skin), "aria-label": `Skin tone ${k + 1}`, style: `--sw:${s.skin}` });
    b.addEventListener("click", () => {
      story.child.skin = k; applyChild();
      [...b.parentNode.children].forEach((x, j) => x.setAttribute("aria-checked", String(j === k)));
    });
    return b;
  });
  const covers = COVERS.map(c => {
    const b = h("button", { type: "button", "aria-pressed": String(c.id === story.child.cover) }, c.label);
    b.addEventListener("click", () => {
      story.child.cover = c.id; applyChild();
      [...b.parentNode.children].forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    });
    return b;
  });
  const greet = h("p", { class: "greet" }, withName("Hello, {name}!"));
  const name = h("input", { type: "text", maxlength: "20", autocomplete: "off", placeholder: "you", value: story.child.name });
  name.addEventListener("input", () => { story.child.name = name.value; applyChild(); greet.textContent = withName("Hello, {name}!"); });
  return [
    h("div", { class: "station-name" }, "Before the day begins"),
    scene({ part: 1 }),
    h("h2", { class: "kid-title" }, "Choose your child"),
    greet,
    h("p", { class: "kid-line" }, "Who is looking in the mirror today? Pick how you look, then follow your day."),
    h("div", { class: "picker" },
      h("fieldset", {}, h("legend", {}, "Skin"), h("div", { class: "swatches", role: "radiogroup", "aria-label": "Skin tone" }, swatches)),
      h("fieldset", {}, h("legend", {}, "Head covering"), h("div", { class: "seg" }, covers)),
      h("label", {}, h("span", {}, "Your name"), name)
    )
  ];
}

function beatView(b) {
  const prompts = [b.prompt ?? []].flat();
  let links;
  if (b.recap) {
    const day = [...new Set(STORY.flatMap(x => x.stations))].map(stationById);
    links = h("div", { class: "recap", role: "group", "aria-label": "Today’s stations" }, day.map((s, k) => {
      const btn = raw("button", { type: "button", title: s.name, "aria-label": `Learn about ${s.name.toLowerCase()}`, style: `--k:${k}` }, ICONS[s.icon]);
      btn.addEventListener("click", () => openStation(s.id));
      return btn;
    }));
  } else {
    links = h("div", { class: "links" }, b.stations.map(id => {
      const s = stationById(id);
      const btn = h("button", { type: "button", class: "go-link" }, raw("span", { class: "mini", "aria-hidden": "true" }, ICONS[s.icon]), "Learn about his ", h("span", { class: "saw", lang: "ar" }, "ﷺ"), ` ${shortName(s)} →`);
      btn.addEventListener("click", () => openStation(id));
      return btn;
    }));
  }
  return [
    h("div", { class: "station-name" }, PARTS[b.part].label),
    scene(b),
    b.greet ? h("p", { class: "greet" }, withName(b.greet)) : null,
    h("h2", { class: "kid-title" }, b.title),
    ...b.lines.map(l => h("p", { class: "kid-line" }, l)),
    prompts.length ? h("div", { class: "prompt" }, prompts.length > 1 ? h("ul", {}, prompts.map(p => h("li", {}, p))) : h("span", {}, prompts[0])) : null,
    links
  ];
}

function renderTrail() {
  const kids = [];
  for (let k = 0; k <= STORY.length; k++) {
    if (k > 1 && STORY[k - 1].part !== STORY[k - 2].part) kids.push(h("span", { class: "gap" }));
    const b = h("button", {
      type: "button", class: `${k === 0 ? "start " : ""}${story.seen.has(k) ? "seen" : ""}`,
      "aria-current": k === story.i ? "step" : null,
      "aria-label": k === 0 ? "Choose your child" : `${k}. ${STORY[k - 1].title}`
    });
    b.addEventListener("click", () => storyGo(k));
    kids.push(b);
  }
  $("trail").replaceChildren(...kids);
}

function renderStoryAdult() {
  const b = STORY[story.i - 1];
  const banner = h("div", { class: "banner" }, "Draft. Awaiting scholarly review. Only the child is drawn: the Prophet ﷺ is never pictured, only described in his Companions’ words.");
  if (!b) { $("sadult").replaceChildren(banner); return; }
  const have = b.refs.filter(r => TEXTS[r]), missing = b.refs.filter(r => !TEXTS[r]);
  $("sadult").replaceChildren(...[banner,
    h("h2", {}, "Sources for this moment"),
    b.note ? h("p", { class: "note" }, b.note) : null,
    ...have.map(r => h("article", { class: "card" }, sourceBlock(r))),
    missing.length ? h("p", { class: "k-explain" }, `Not yet in our checked texts: ${missing.join(", ")}.`) : null,
    b.recap ? h("p", { class: "k-explain" }, "A look back at the day. Each icon opens its station, with its sources.") : null
  ].filter(Boolean));
}

function renderStory(animate = false) {
  $("sinner").replaceChildren(...corners(), ...(story.i === 0 ? pickerView() : beatView(STORY[story.i - 1])).filter(Boolean));
  renderTrail(); renderStoryAdult();
  $("sback").disabled = story.i === 0;
  $("snext").disabled = story.i === STORY.length;
  $("snext").textContent = story.i === 0 ? "Start the day" : "Next";
  $("scount").textContent = story.i === 0 ? "Start" : `${story.i} of ${STORY.length}`;
  if (animate) {
    const st = $("sstage");
    st.classList.remove("enter"); void st.offsetWidth; st.classList.add("enter");
  }
}

function storyGo(i) {
  if (i < 0 || i > STORY.length || i === story.i) return;
  story.i = i; story.seen.add(i);
  renderStory(true);
}

function setMode(m, animate = true) {
  mode = m;
  for (const id of ["learn", "story"]) $(id).hidden = id !== m;
  document.querySelectorAll("#modes button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  try { localStorage.setItem("mode", m); } catch {}
  if (m === "learn") render(animate); else renderStory(animate);
  if (animate) {
    const el = $(m);
    el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter");
    window.scrollTo(0, 0);
  }
}

/* ---- Wiring ---- */

const step = d => mode === "story" ? storyGo(story.i + d) : go(state.i + d);
$("back").addEventListener("click", () => go(state.i - 1));
$("next").addEventListener("click", () => go(state.i + 1));
$("sback").addEventListener("click", () => storyGo(story.i - 1));
$("snext").addEventListener("click", () => storyGo(story.i + 1));
document.querySelectorAll("#modes button").forEach(b => b.addEventListener("click", () => { if (b.dataset.mode !== mode) setMode(b.dataset.mode); }));
document.addEventListener("keydown", e => {
  if (e.target.closest("input, summary")) return;
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
});
let x0 = null;
for (const id of ["stage", "sstage"]) {
  $(id).addEventListener("pointerdown", e => { x0 = e.clientX; });
  $(id).addEventListener("pointerup", e => {
    if (x0 == null) return;
    const dx = e.clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  });
}

const grown = $("grown");
try { grown.checked = localStorage.getItem("grown") === "1"; } catch {}
const applyGrown = () => {
  $("app").classList.toggle("grown", grown.checked);
  try { localStorage.setItem("grown", grown.checked ? "1" : "0"); } catch {}
};
grown.addEventListener("change", applyGrown);
applyGrown();
document.querySelectorAll(".corner").forEach(c => { c.innerHTML = CORNER; });
applyChild();
setMode(mode, false);
</script>
