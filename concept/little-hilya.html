ion of Allah's \nApostle . My aunt took me to him and said, 'O Allah's Messenger (ﷺ)! My nephew is sick; will you invoke \nAllah for him?' So he invoked (Allah) for me.\"", "ch": 61, "ch_en": "Virtues and Merits of the Prophet (pbuh) and his Companions", "ch_ar": "كتاب المناقب"}, "bukhari:3528": {"ar": "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، حَدَّثَنَا سَعِيدٌ، وَقَالَ، لِي خَلِيفَةُ حَدَّثَنَا مُحَمَّدُ بْنُ سَوَاءٍ، وَكَهْمَسُ بْنُ الْمِنْهَالِ، قَالاَ حَدَّثَنَا سَعِيدٌ، عَنْ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ ـ رضى الله عنه ـ قَالَ صَعِدَ النَّبِيُّ صلى الله عليه وسلم إِلَى أُحُدٍ وَمَعَهُ أَبُو بَكْرٍ وَعُمَرُ وَعُثْمَانُ فَرَجَفَ بِهِمْ، فَضَرَبَهُ بِرِجْلِهِ، قَالَ ‏\n\"‏ اثْبُتْ أُحُدُ فَمَا عَلَيْكَ إِلاَّ نَبِيٌّ أَوْ صِدِّيقٌ أَوْ شَهِيدَانِ ‏\"‏‏.‏", "narrator": "Narrated Anas bin Malik:", "en": "The Prophet (ﷺ) ascended the mountain of Uhud and he was accompanied by Abu Bakr, `Umar and \n`Uthman. The mountain shook beneath them. The Prophet (ﷺ) hit it with his foot and said, \"O Uhud ! Be \nfirm, for on you there is none but a Prophet, a Siddiq and a martyr (i.e. and two martyrs).", "ch": 62, "ch_en": "Companions of the Prophet", "ch_ar": "كتاب فضائل أصحاب النبى صلى الله عليه وسلم"}, "bukhari:3746": {"ar": "حَدَّثَنِي زَكَرِيَّاءُ بْنُ يَحْيَى، عَنْ أَبِي أُسَامَةَ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ أَسْمَاءَ ـ رضى الله عنها ـ أَنَّهَا حَمَلَتْ بِعَبْدِ اللَّهِ بْنِ الزُّبَيْرِ، قَالَتْ فَخَرَجْتُ وَأَنَا مُتِمٌّ، فَأَتَيْتُ الْمَدِينَةَ، فَنَزَلْتُ بِقُبَاءٍ، فَوَلَدْتُهُ بِقُبَاءٍ، ثُمَّ أَتَيْتُ بِهِ النَّبِيَّ صلى الله عليه وسلم فَوَضَعْتُهُ فِي حَجْرِهِ، ثُمَّ دَعَا بِتَمْرَةٍ، فَمَضَغَهَا، ثُمَّ تَفَلَ فِي فِيهِ، فَكَانَ أَوَّلَ شَىْءٍ دَخَلَ جَوْفَهُ رِيقُ رَسُولِ اللَّهِ صلى الله عليه وسلم، ثُمَّ حَنَّكَهُ بِتَمْرَةٍ ثُمَّ دَعَا لَهُ وَبَرَّكَ عَلَيْهِ، وَكَانَ أَوَّلَ مَوْلُودٍ وُلِدَ فِي الإِسْلاَمِ‏.‏ تَابَعَهُ خَالِدُ بْنُ مَخْلَدٍ عَنْ عَلِيِّ بْنِ مُسْهِرٍ عَنْ هِشَامٍ عَنْ أَبِيهِ عَنْ أَسْمَاءَ ـ رضى الله عنها ـ أَنَّهَا هَاجَرَتْ إِلَى النَّبِيِّ صلى الله عليه وسلم وَهْىَ حُبْلَى‏.‏", "narrator": "Narrated Asma:", "en": "That she conceived `Abdullah bin Az-Zubair. She added, \"I migrated to Medina while I was at full \nterm of pregnancy and alighted at Quba where I gave birth to him. Then I brought him to the Prophet (ﷺ) \nand put him in his lap. The Prophet (ﷺ) asked for a date, chewed it, and put some of its juice in the child's \nmouth. So, the first thing that entered the child's stomach was the saliva of Allah's Messenger (ﷺ). Then the \nProphet rubbed the child's palate with a date and invoked for Allah's Blessings on him, and he was the \nfirst child born amongst the Emigrants in the Islamic Land (i.e. Medina).", "ch": 63, "ch_en": "Merits of the Helpers in Madinah (Ansaar)", "ch_ar": "كتاب مناقب الأنصار"}, "bukhari:3930": {"ar": "حَدَّثَنِي عَمْرُو بْنُ عَلِيٍّ، حَدَّثَنَا أَبُو عَاصِمٍ، أَخْبَرَنَا حَنْظَلَةُ بْنُ أَبِي سُفْيَانَ، أَخْبَرَنَا سَعِيدُ بْنُ مِينَاءَ، قَالَ سَمِعْتُ جَابِرَ بْنَ عَبْدِ اللَّهِ ـ رضى الله عنهما ـ قَالَ لَمَّا حُفِرَ الْخَنْدَقُ رَأَيْتُ بِالنَّبِيِّ صلى الله عليه وسلم خَمَصًا شَدِيدًا، فَانْكَفَأْتُ إِلَى امْرَأَتِي فَقُلْتُ هَلْ عِنْدَكِ شَىْءٌ فَإِنِّي رَأَيْتُ بِرَسُولِ اللَّهِ صلى الله عليه وسلم خَمَصًا شَدِيدًا‏.‏ فَأَخْرَجَتْ إِلَىَّ جِرَابًا فِيهِ صَاعٌ مِنْ شَعِيرٍ، وَلَنَا بُهَيْمَةٌ دَاجِنٌ فَذَبَحْتُهَا، وَطَحَنَتِ الشَّعِيرَ فَفَرَغَتْ إِلَى فَرَاغِي، وَقَطَّعْتُهَا فِي بُرْمَتِهَا، ثُمَّ وَلَّيْتُ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَقَالَتْ لاَ تَفْضَحْنِي بِرَسُولِ اللَّهِ صلى الله عليه وسلم وَبِمَنْ مَعَهُ‏.‏ فَجِئْتُهُ فَسَارَرْتُهُ فَقُلْتُ يَا رَسُولَ اللَّهِ ذَبَحْنَا بُهَيْمَةً لَنَا وَطَحَنَّا صَاعًا مِنْ شَعِيرٍ كَانَ عِنْدَنَا، فَتَعَالَ أَنْتَ وَنَفَرٌ مَعَكَ‏.‏ فَصَاحَ النَّبِيُّ صلى الله عليه وسلم فَقَالَ ‏\"‏ يَا أَهْلَ الْخَنْدَقِ، إِنَّ جَابِرًا قَدْ صَنَعَ سُورًا فَحَىَّ هَلاً بِكُمْ ‏\"‏‏.‏ فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ لاَ تُنْزِلُنَّ بُرْمَتَكُمْ، وَلاَ تَخْبِزُنَّ عَجِينَكُمْ حَتَّى أَجِيءَ ‏\"‏‏.‏ فَجِئْتُ وَجَاءَ رَسُولُ اللَّهِ صلى الله عليه وسلم يَقْدُمُ النَّاسَ حَتَّى جِئْتُ امْرَأَتِي، فَقَالَتْ بِكَ وَبِكَ‏.‏ فَقُلْتُ قَدْ فَعَلْتُ الَّذِي قُلْتِ‏.‏ فَأَخْرَجَتْ لَهُ عَجِينًا، فَبَصَقَ فِيهِ وَبَارَكَ، ثُمَّ عَمَدَ إِلَى بُرْمَتِنَا فَبَصَقَ وَبَارَكَ ثُمَّ قَالَ ‏\"‏ ادْعُ خَابِزَةً فَلْتَخْبِزْ مَعِي وَاقْدَحِي مِنْ بُرْمَتِكُمْ وَلاَ تُنْزِلُوهَا‏\"‏، وَهُمْ أَلْفٌ، فَأُقْسِمُ بِاللَّهِ لَقَدْ أَكَلُوا حَتَّى تَرَكُوهُ وَانْحَرَفُوا، وَإِنَّ بُرْمَتَنَا لَتَغِطُّ كَمَا هِيَ، وَإِنَّ عَجِينَنَا لَيُخْبَزُ كَمَا هُوَ‏.‏", "narrator": "Narrated Jabir bin `Abdullah:", "en": "When the Trench was dug, I saw the Prophet (ﷺ) in the state of severe hunger. So I returned to my wife \nand said, \"Have you got anything (to eat), for I have seen Allah's Messenger (ﷺ) in a state of severe hunger.\" \nShe brought out for me, a bag containing one Sa of barley, and we had a domestic she animal (i.e. a \nkid) which I slaughtered then, and my wife ground the barley and she finished at the time I finished \nmy job (i.e. slaughtering the kid). Then I cut the meat into pieces and put it in an earthenware \n(cooking) pot, and returned to Allah's Messenger (ﷺ) . My wife said, \"Do not disgrace me in front of Allah's \nApostle and those who are with him.\" So I went to him and said to him secretly, \"O Allah's Messenger (ﷺ)! I \nhave slaughtered a she-animal (i.e. kid) of ours, and we have ground a Sa of barley which was with us. \nSo please come, you and another person along with you.\" The Prophet (ﷺ) raised his voice and said, \"O \npeople of Trench ! Jabir has prepared a meal so let us go.\" Allah's Messenger (ﷺ) said to me, \"Don't put \ndown your earthenware meat pot (from the fireplace) or bake your dough till I come.\" So I came (to \nmy house) and Allah's Messenger (ﷺ) too, came, proceeding before the people. When I came to my wife, she \nsaid, \"May Allah do so-and-so to you.\" I said, \"I have told the Prophet (ﷺ) of what you said.\" Then she \nbrought out to him (i.e. the Prophet (ﷺ) the dough, and he spat in it and invoked for Allah's Blessings in it. \nThen he proceeded towards our earthenware meat-pot and spat in it and invoked for Allah's Blessings \nin it. Then he said (to my wife). Call a lady-baker to bake along with you and keep on taking out \nscoops from your earthenware meat-pot, and do not put it down from its fireplace.\" They were onethousand \n(who took their meals), and by Allah they all ate, and when they left the food and went \naway, our earthenware pot was still bubbling (full of meat) as if it had not decreased, and our dough \nwas still being baked as if nothing had been taken from it.", "ch": 64, "ch_en": "Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)", "ch_ar": "كتاب المغازى"}, "bukhari:4167": {"ar": "حَدَّثَنَا يُوسُفُ بْنُ مُوسَى، أَخْبَرَنَا أَبُو أُسَامَةَ، عَنْ إِسْمَاعِيلَ بْنِ أَبِي خَالِدٍ، عَنْ قَيْسٍ، عَنْ جَرِيرٍ، قَالَ قَالَ لِي رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ أَلاَ تُرِيحُنِي مِنْ ذِي الْخَلَصَةِ ‏\"‏‏.‏ فَقُلْتُ بَلَى‏.‏ فَانْطَلَقْتُ فِي خَمْسِينَ وَمِائَةِ فَارِسٍ مِنْ أَحْمَسَ وَكَانُوا أَصْحَابَ خَيْلٍ وَكُنْتُ لاَ أَثْبُتُ عَلَى الْخَيْلِ، فَذَكَرْتُ ذَلِكَ لِلنَّبِيِّ صلى الله عليه وسلم فَضَرَبَ يَدَهُ عَلَى صَدْرِي حَتَّى رَأَيْتُ أَثَرَ يَدِهِ فِي صَدْرِي وَقَالَ ‏\"‏ اللَّهُمَّ ثَبِّتْهُ وَاجْعَلْهُ هَادِيًا مَهْدِيًّا ‏\"‏‏.‏ قَالَ فَمَا وَقَعْتُ عَنْ فَرَسٍ بَعْدُ‏.‏ قَالَ وَكَانَ ذُو الْخَلَصَةِ بَيْتًا بِالْيَمَنِ لِخَثْعَمَ وَبَجِيلَةَ، فِيهِ نُصُبٌ تُعْبَدُ، يُقَالُ لَهُ الْكَعْبَةُ‏.‏ قَالَ فَأَتَاهَا فَحَرَّقَهَا بِالنَّارِ وَكَسَرَهَا‏.‏ قَالَ وَلَمَّا قَدِمَ جَرِيرٌ الْيَمَنَ كَانَ بِهَا رَجُلٌ يَسْتَقْسِمُ بِالأَزْلاَمِ فَقِيلَ لَهُ إِنَّ رَسُولَ رَسُولِ اللَّهِ صلى الله عليه وسلم هَا هُنَا فَإِنْ قَدَرَ عَلَيْكَ ضَرَبَ عُنُقَكَ‏.‏ قَالَ فَبَيْنَمَا هُوَ يَضْرِبُ بِهَا إِذْ وَقَفَ عَلَيْهِ جَرِيرٌ فَقَالَ لَتَكْسِرَنَّهَا وَلَتَشْهَدَنَّ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ أَوْ لأَضْرِبَنَّ عُنُقَكَ‏.‏ قَالَ فَكَسَرَهَا وَشَهِدَ، ثُمَّ بَعَثَ جَرِيرٌ رَجُلاً مِنْ أَحْمَسَ يُكْنَى أَبَا أَرْطَاةَ إِلَى النَّبِيِّ صلى الله عليه وسلم يُبَشِّرُهُ بِذَلِكَ، فَلَمَّا أَتَى النَّبِيَّ صلى الله عليه وسلم قَالَ يَا رَسُولَ اللَّهِ وَالَّذِي بَعَثَكَ بِالْحَقِّ مَا جِئْتُ حَتَّى تَرَكْتُهَا كَأَنَّهَا جَمَلٌ أَجْرَبُ‏.‏ قَالَ فَبَرَّكَ النَّبِيُّ صلى الله عليه وسلم عَلَى خَيْلِ أَحْمَسَ وَرِجَالِهَا خَمْسَ مَرَّاتٍ‏.‏", "narrator": "Narrated Qais:", "en": "Jarir said \"Allah's Messenger (ﷺ) said to me, \"Won't you relieve me from Dhul-Khalasa?\" I replied, \"Yes, (I \nwill relieve you).\" So I proceeded along with one-hundred and fifty cavalry from Ahmas tribe who \nwere skillful in riding horses. I used not to sit firm over horses, so I informed the Prophet (ﷺ) of that, and \nhe stroke my chest with his hand till I saw the marks of his hand over my chest and he said, O Allah! \nMake him firm and one who guides others and is guided (on the right path).' Since then I have never \nfallen from a horse. Dhul-l--Khulasa was a house in Yemen belonging to the tribe of Khatham and \nBajaila, and in it there were idols which were worshipped, and it was called Al-Ka`ba.\" Jarir went \nthere, burnt it with fire and dismantled it. When Jarir reached Yemen, there was a man who used to \nforetell and give good omens by casting arrows of divination. Someone said to him. \"The messenger \nof Allah's Messenger (ﷺ) is present here and if he should get hold of you, he would chop off your neck.\" One \nday while he was using them (i.e. arrows of divination), Jarir stopped there and said to him, \"Break \nthem (i.e. the arrows) and testify that None has the right to be worshipped except Allah, or else I will \nchop off your neck.\" So the man broke those arrows and testified that none has the right to be \nworshipped except Allah. Then Jarir sent a man called Abu Artata from the tribe of Ahmas to the \nProphet to convey the good news (of destroying Dhu-l-Khalasa). So when the messenger reached the \nProphet, he said, \"O Allah's Messenger (ﷺ)! By Him Who sent you with the Truth, I did not leave it till it was \nlike a scabby camel.\" Then the Prophet (ﷺ) blessed the horses of Ahmas and their men five times.", "ch": 64, "ch_en": "Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)", "ch_ar": "كتاب المغازى"}, "bukhari:5669": {"ar": "حَدَّثَنَا مَالِكُ بْنُ إِسْمَاعِيلَ، حَدَّثَنَا إِسْرَائِيلُ، عَنْ عُثْمَانَ بْنِ عَبْدِ اللَّهِ بْنِ مَوْهَبٍ، قَالَ أَرْسَلَنِي أَهْلِي إِلَى أُمِّ سَلَمَةَ بِقَدَحٍ مِنْ مَاءٍ ـ وَقَبَضَ إِسْرَائِيلُ ثَلاَثَ أَصَابِعَ ـ مِنْ فِضَّةٍ فِيهِ شَعَرٌ مِنْ شَعَرِ النَّبِيِّ صلى الله عليه وسلم وَكَانَ إِذَا أَصَابَ الإِنْسَانَ عَيْنٌ أَوْ شَىْءٌ بَعَثَ إِلَيْهَا مِخْضَبَهُ، فَاطَّلَعْتُ فِي الْجُلْجُلِ فَرَأَيْتُ شَعَرَاتٍ حُمْرًا‏.‏", "narrator": "Narrated IsraiI:", "en": "`Uthman bin `Abdullah bin Mauhab said, \"My people sent me with a bowl of water to Um Salama.\" \nIsra'il approximated three fingers ('indicating the small size of the container in which there was some \nhair of the Prophet. `Uthman added, \"If any person suffered from evil eye or some other disease, he \nwould send a vessel (containing water) to Um Salama. I looked into the container (that held the hair \nof the Prophet) and saw a few red hairs in it,\"", "ch": 77, "ch_en": "Dress", "ch_ar": "كتاب اللباس"}, "muslim:5896": {"ar": "حَدَّثَنَا عَمْرُو بْنُ حَمَّادِ بْنِ طَلْحَةَ الْقَنَّادُ، حَدَّثَنَا أَسْبَاطٌ، - وَهُوَ ابْنُ نَصْرٍ الْهَمْدَانِيُّ\n - عَنْ سِمَاكٍ، عَنْ جَابِرِ بْنِ سَمُرَةَ، قَالَ صَلَّيْتُ مَعَ رَسُولِ اللَّهِ صلى الله عليه وسلم صَلاَةَ\n الأُولَى ثُمَّ خَرَجَ إِلَى أَهْلِهِ وَخَرَجْتُ مَعَهُ فَاسْتَقْبَلَهُ وِلْدَانٌ فَجَعَلَ يَمْسَحُ خَدَّىْ أَحَدِهِمْ وَاحِدًا\n وَاحِدًا - قَالَ - وَأَمَّا أَنَا فَمَسَحَ خَدِّي - قَالَ - فَوَجَدْتُ لِيَدِهِ بَرْدًا أَوْ رِيحًا كَأَنَّمَا أَخْرَجَهَا\n مِنْ جُؤْنَةِ عَطَّارٍ ‏.‏", "narrator": "Jabir b. Samura reported:", "en": "I prayed along with Allah's Messenger (ﷺ) the first prayer. He then went to his family and I also went along with him when he met some children (on the way). He began to pat the cheeks of each one of them. He also patted my cheek and I experienced a coolness or a fragrance of his hand as if it had been brought out from the scent bag of a perfumer.", "ch": 43, "ch_en": "The Book of Virtues", "ch_ar": "كتاب الفضائل"}, "muslim:5899": {"ar": "حَدَّثَنِي زُهَيْرُ بْنُ حَرْبٍ، حَدَّثَنَا هَاشِمٌ، - يَعْنِي ابْنَ الْقَاسِمِ - عَنْ سُلَيْمَانَ، عَنْ \n ثَابِتٍ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ دَخَلَ عَلَيْنَا النَّبِيُّ صلى الله عليه وسلم فَقَالَ عِنْدَنَا فَعَرِقَ\n وَجَاءَتْ أُمِّي بِقَارُورَةٍ فَجَعَلَتْ تَسْلُتُ الْعَرَقَ فِيهَا فَاسْتَيْقَظَ النَّبِيُّ صلى الله عليه وسلم\n فَقَالَ ‏\n\"‏ يَا أُمَّ سُلَيْمٍ مَا هَذَا الَّذِي تَصْنَعِينَ ‏\"‏ ‏.‏ قَالَتْ هَذَا عَرَقُكَ نَجْعَلُهُ فِي طِيبِنَا وَهُوَ\n مِنْ أَطْيَبِ الطِّيبِ ‏.‏", "narrator": "Anas b. Malik reported that Allah's Apostle (ﷺ) used to come to our house and there was perspiration upon his body. My mother brought a bottle and began to pour the sweat in that. When Allah's Apostle (ﷺ) got up he said:", "en": "Umm Sulaim, what is this that you are doing? Thereupon she said: That is your sweat which we mix in our perfume and it becomes the most fragrant perfume.", "ch": 43, "ch_en": "The Book of Virtues", "ch_ar": "كتاب الفضائل"}, "tirmidhi:3722": {"ar": "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، بُنْدَارٌ حَدَّثَنَا أَبُو عَاصِمٍ، حَدَّثَنَا عَزْرَةُ بْنُ ثَابِتٍ، حَدَّثَنَا عِلْبَاءُ بْنُ أَحْمَرَ، حَدَّثَنَا أَبُو زَيْدِ بْنُ أَخْطَبَ، قَالَ مَسَحَ رَسُولُ اللَّهِ صلى الله عليه وسلم يَدَهُ عَلَى وَجْهِي وَدَعَا لِي قَالَ عَزْرَةُ إِنَّهُ عَاشَ مِائَةً وَعِشْرِينَ سَنَةً وَلَيْسَ فِي رَأْسِهِ إِلاَّ شَعَرَاتٌ بِيضٌ ‏.‏ قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ ‏.‏ وَأَبُو زَيْدٍ اسْمُهُ عَمْرُو بْنُ أَخْطَبَ ‏.‏", "narrator": "Narrated Abu Zaid bin Akhtab:", "en": "\"The Messenger of Allah (ﷺ) wiped his hand over my face and supplicated for me.\" 'Azrah (one of the narrators) said: \"Indeed he lived for one-hundred and twenty years, and there weren't upon his head except for a few small grey hairs.\"", "ch": 49, "ch_en": "Chapters on Virtues", "ch_ar": "كتاب المناقب عن رسول الله صلى الله عليه وسلم"}, "abudawud:1958": {"ar": "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا عَبْدُ الْوَارِثِ، عَنْ حُمَيْدٍ الأَعْرَجِ، عَنْ مُحَمَّدِ بْنِ إِبْرَاهِيمَ التَّيْمِيِّ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ مُعَاذٍ التَّيْمِيِّ، قَالَ خَطَبَنَا رَسُولُ اللَّهِ صلى الله عليه وسلم وَنَحْنُ بِمِنًى فَفُتِحَتْ أَسْمَاعُنَا حَتَّى كُنَّا نَسْمَعُ مَا يَقُولُ وَنَحْنُ فِي مَنَازِلِنَا فَطَفِقَ يُعَلِّمُهُمْ مَنَاسِكَهُمْ حَتَّى بَلَغَ الْجِمَارَ فَوَضَعَ أُصْبُعَيْهِ السَّبَّابَتَيْنِ فِي أُذُنَيْهِ ثُمَّ قَالَ ‏\n\"‏ بِحَصَى الْخَذْفِ ‏\"‏ ‏.‏ ثُمَّ أَمَرَ الْمُهَاجِرِينَ فَنَزَلُوا فِي مُقَدَّمِ الْمَسْجِدِ وَأَمَرَ الأَنْصَارَ فَنَزَلُوا مِنْ وَرَاءِ الْمَسْجِدِ ثُمَّ نَزَلَ النَّاسُ بَعْدَ ذَلِكَ ‏.‏", "narrator": "Narrated AbdurRahman ibn Mu'adh at-Taymi:", "en": "The Messenger of Allah (ﷺ) addressed us when we were at Mina. Our hearing was opened, so that we could hear what he was saying while we were in our dwellings. He began to teach them the rites of hajj till he reached the injunction of throwing pebbles at the Jamrahs (pillars at Mina). He put his forefingers in his ears and said: (Throw small pebbles. He then commanded the Emigrants (Muhajirun) to station themselves. They stationed themselves before the mosque. He then commanded the Helpers (Ansar) to encamp. They encamped behind the mosque. Thereafter the people encamped.", "ch": 11, "ch_en": "The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)", "ch_ar": "كتاب المناسك", "corrected": [{"original": "Our ears were open and we were listening to what he was saying, while we were in our dwellings.", "replacement": "Our hearing was opened, so that we could hear what he was saying while we were in our dwellings.", "reason": "فَفُتِحَتْ أَسْمَاعُنَا حَتَّى كُنَّا نَسْمَعُ مَا يَقُولُ وَنَحْنُ فِي مَنَازِلِنَا: فُتِحَتْ is passive (“was opened”) and حَتَّى gives the result (“so that we could hear”). The English loses that their hearing was opened for them."}]}};

    61: "Manāqib", 62: "Faḍāʾil al-Ṣaḥāba", 63: "Manāqib al-Anṣār", 64: "Maghāzī", 77: "Libās" } },
  muslim: { name: "Muslim", books: { 43: "Faḍāʾil" } },
  tirmidhi: { name: "Jāmiʿ al-Tirmidhī", books: { 49: "Manāqib" } },
  abudawud: { name: "Abū Dāwūd", books: { 11: "Manāsik" } }
};

function cite(ref) {
  const t = TEXTS[ref];
  const [col, n] = ref.split(":");
  if (col === "shamail") return { label: `Shamāʾil, ch. ${t.ch}: ${n}`, url: `https://sunnah.com/shamail:${n}`, exact: true };
  const b = BOOKS[col] ?? { name: col };
  const book = b.books?.[t.ch] ?? t.ch_en ?? "Book";
  return { label: `${b.name}, ${book} (${t.ch}): ${n}`, url: `https://sunnah.com/${col}/${t.ch}`, exact: false };
}

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}

function sourceBlock(ref, extra = []) {
  const c = cite(ref), t = TEXTS[ref];
  return h("div", { class: "meta" },
    h("a", { class: "cite", href: c.url, target: "_blank", rel: "noopener" }, c.label),
    c.exact ? null : h("span", {}, "(opens the book; number to verify)"),
    ...extra,
    t.corrected ? h("span", { class: "badge" }, "Translation corrected") : null,
    h("span", { class: "badge draft" }, "Draft"),
    h("details", { style: "flex-basis:100%" },
      h("summary", {}, "Read the full hadith"),
      h("div", { class: "src" },
        h("p", { lang: "ar" }, t.ar),
        h("p", { class: "en" }, h("strong", {}, t.narrator), " ", t.en),
        ...(t.corrected ?? []).map(c => h("p", { class: "note" },
          `We corrected the dataset English: “${c.original}” → “${c.replacement}”. `, c.reason)),
        h("small", {}, `Chapter: ${t.ch_en} · `, h("span", { lang: "ar" }, t.ch_ar))
      )
    )
  );
}

const state = { i: 0, tab: "char", seen: new Set([0]) };
const $ = id => document.getElementById(id);

function renderIndex() {
  $("index").replaceChildren(...STATIONS.map((s, i) =>
    h("button", {
      class: state.seen.has(i) ? "seen" : "",
      "aria-current": i === state.i ? "step" : null,
      onclick: null
    }, h("span", { class: "dot" }, i === 0 ? "★" : String(i)), s.name)
  ));
  [...$("index").children].forEach((b, i) => b.addEventListener("click", () => go(i)));
  $("index").children[state.i]?.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
}

function renderRing() {
  const n = STATIONS.length - 1;
  $("ring").innerHTML = STATIONS.slice(1).map((_, k) => {
    const a = 2 * Math.PI * k / n, i = k + 1;
    const cls = i === state.i ? "now" : state.seen.has(i) ? "seen" : "";
    return `<circle class="${cls}" cx="${(50 + 48.4 * Math.sin(a)).toFixed(2)}" cy="${(50 - 48.4 * Math.cos(a)).toFixed(2)}" r="${i === state.i ? 1.7 : 1.2}"/>`;
  }).join("");
}

function renderStage(animate) {
  const s = STATIONS[state.i];
  $("icon").innerHTML = ICONS[s.icon];
  $("phrase").textContent = s.phrase;
  $("sname").textContent = s.name;
  $("ktitle").textContent = s.title;
  $("kline").textContent = s.line;
  renderRing();
  if (animate) {
    const st = $("stage");
    st.classList.remove("enter"); void st.offsetWidth; st.classList.add("enter");
  }
}

function renderChips() {
  const s = STATIONS[state.i];
  const tabs = [
    { id: "char", label: "Character", n: s.character.length, cls: "c-char" },
    { id: "sign", label: "Special signs", n: s.signs.length, cls: "c-sign" },
    { id: "mirror", label: "Mirror", n: null, cls: "c-mirror" }
  ];
  $("chips").replaceChildren(...tabs.map(t => {
    const b = h("button", { class: `chip ${t.cls}`, role: "tab", "aria-selected": String(state.tab === t.id) },
      t.label, t.n != null ? h("span", { class: "n" }, String(t.n)) : null);
    b.addEventListener("click", () => { state.tab = t.id; renderChips(); renderCards(); });
    return b;
  }));
  $("chips").hidden = state.i === 0;
}

function renderCards() {
  const s = STATIONS[state.i];
  const box = $("cards");
  if (state.i === 0) {
    box.replaceChildren(h("div", { class: "card" },
      h("h3", {}, "How it works"),
      h("p", {}, "Each stop starts with how he looked, as his Companions described him. Then tap the buttons to see the good character it reminds us of, the special signs Allah gave him, and a little mirror challenge for you."),
      h("p", { class: "k-explain" }, "Following the order of Imam al-Tirmidhī’s book al-Shamāʾil al-Muḥammadiyya.")
    ));
    return;
  }
  let cards = [];
  if (state.tab === "char") {
    cards = s.character.map(c => h("article", { class: "card" },
      h("h3", {}, h("span", { class: "pill k-trait" }, c.trait)),
      h("p", {}, c.line),
      h("div", { class: "adult" }, c.note ? h("p", { class: "note" }, c.note) : null, sourceBlock(c.ref, [h("span", { class: "badge" }, c.basis === "classical" ? "Classical link" : "Our reflection")]))
    ));
    if (!cards.length) cards = [h("article", { class: "card research" },
      h("h3", {}, h("span", { class: "pill k-research" }, KINDS.research.label)),
      h("p", {}, "We are still looking for checked reports that link this to his character."))];
  } else if (state.tab === "sign") {
    cards = Object.keys(KINDS).flatMap(kind => {
      const group = s.signs.filter(g => g.kind === kind);
      if (!group.length) return [];
      return [h("div", { class: "group" },
        h("h3", { class: "group-head" }, h("span", { class: `pill k-${kind}` }, KINDS[kind].label)),
        h("p", { class: "k-explain" }, KINDS[kind].explain),
        ...group.map(g => h("article", { class: `card ${kind === "research" ? "research" : ""}` },
          h("h3", {}, g.title),
          h("p", {}, g.line),
          g.trait ? h("p", { class: "k-explain" }, `Reminds us he was ${g.trait.toLowerCase()}.`) : null,
          g.ref ? h("div", { class: "adult" }, g.note ? h("p", { class: "note" }, g.note) : null, sourceBlock(g.ref, [h("span", { class: "badge" }, "Category: ours")])) : null
        ))
      )];
    });
  } else {
    cards = [h("article", { class: "card mirror" },
      h("h3", {}, h("span", { class: "pill k-khasisa" }, "Mirror"), "Coming soon"),
      h("p", {}, s.mirror),
      h("p", { class: "k-explain" }, "Placeholder for the mirror story: a child looking at themselves from head to toe.")
    )];
  }
  box.replaceChildren(...cards);
}

function renderAdult() {
  const s = STATIONS[state.i];
  $("adult").replaceChildren(
    h("div", { class: "banner" }, "Draft. Awaiting scholarly review. Links to character are our own reflections unless marked “Classical link”, and sign categories are ours unless a source states one."),
    h("h2", {}, "What the Companions described"),
    ...s.physical.map(p => h("article", { class: "card quote" },
      h("p", { lang: "ar" }, p.phrase),
      p.gloss ? h("p", {}, p.gloss) : null,
      p.note ? h("p", { class: "note" }, p.note) : null,
      sourceBlock(p.ref)
    )),
    h("p", { class: "k-explain" }, "Numbers come from the hadith-json dataset. Its Bukhārī and Muslim numbers differ from sunnah.com, so those links open the book page.")
  );
}

function render(animate = false) {
  renderIndex(); renderStage(animate); renderChips(); renderCards(); renderAdult();
  $("back").disabled = state.i === 0;
  $("next").disabled = state.i === STATIONS.length - 1;
  $("next").textContent = state.i === 0 ? "Begin" : "Next";
  $("count").textContent = state.i === 0 ? "Start" : `${state.i} of ${STATIONS.length - 1}`;
}

function go(i) {
  if (i < 0 || i >= STATIONS.length || i === state.i) return;
  state.i = i; state.seen.add(i); state.tab = "char";
  render(true);
}

$("back").addEventListener("click", () => go(state.i - 1));
$("next").addEventListener("click", () => go(state.i + 1));
document.addEventListener("keydown", e => {
  if (e.target.closest("input, summary")) return;
  if (e.key === "ArrowRight") go(state.i + 1);
  if (e.key === "ArrowLeft") go(state.i - 1);
});
let x0 = null;
$("stage").addEventListener("pointerdown", e => { x0 = e.clientX; });
$("stage").addEventListener("pointerup", e => {
  if (x0 == null) return;
  const dx = e.clientX - x0; x0 = null;
  if (Math.abs(dx) > 50) go(state.i + (dx < 0 ? 1 : -1));
});

const grown = $("grown");
try { grown.checked = localStorage.getItem("grown") === "1"; } catch {}
const applyGrown = () => {
  $("app").classList.toggle("grown", grown.checked);
  try { localStorage.setItem("grown", grown.checked ? "1" : "0"); } catch {}
};
grown.addEventListener("change", applyGrown);
applyGrown();
document.querySelectorAll(".corner").forEach(c => { c.innerHTML = CORNER; });
render(false);
</script>
