<title>Little Hilya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one Hilya panel (basmala band, medallion, crescent, verse band) as the stage; chips and grown-up notes flow beneath it. */
:root {
  --bg: #e6f0ea;        /* marbled-paper mint */
  --panel: #fbfcf7;
  --ink: #1d3836;
  --muted: #566d69;
  --gold: #a87a22;
  --gold-soft: #f1e2bd;
  --rose: #c2577a;
  --lapis: #2b5888;
  --sage: #7fb096;
  --line: #cadfd3;
  --chip: #ffffff;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --ar: "Amiri", "Traditional Arabic", "Times New Roman", serif;
  --ar-display: "Aref Ruqaa", "Amiri", "Traditional Arabic", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111a2c; --panel: #19233d; --ink: #eef1e7; --muted: #a6b1c6;
    --gold: #e2b65a; --gold-soft: #3a3420; --rose: #ee93ad; --lapis: #92b7ea;
    --sage: #6fa489; --line: #2b385a; --chip: #212d4b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111a2c; --panel: #19233d; --ink: #eef1e7; --muted: #a6b1c6;
  --gold: #e2b65a; --gold-soft: #3a3420; --rose: #ee93ad; --lapis: #92b7ea;
  --sage: #6fa489; --line: #2b385a; --chip: #212d4b; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(60rem 30rem at 10% -10%, color-mix(in srgb, var(--sage) 22%, transparent), transparent 70%),
    radial-gradient(50rem 30rem at 110% 20%, color-mix(in srgb, var(--rose) 12%, transparent), transparent 70%);
  color: var(--ink);
  font: 17px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 18px; }
[lang="ar"] { font-family: var(--ar); direction: rtl; }
a { color: var(--lapis); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--lapis); outline-offset: 3px; border-radius: 8px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font: 800 1.7rem/1 var(--display); margin: 0; letter-spacing: -0.01em; }
.brand span { font: 700 1.5rem/1 var(--ar-display); color: var(--gold); }
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.95rem; color: var(--muted); user-select: none; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.switch { width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .2s; }
.toggle input:checked + .switch { background: var(--lapis); }
.toggle input:checked + .switch::after { transform: translateX(18px); }
.toggle input:focus-visible + .switch { outline: 3px solid var(--lapis); outline-offset: 2px; }

/* Station index */
.index {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin;
  scroll-snap-type: x proximity; scroll-padding-inline: 24px; overscroll-behavior-x: contain;
}
.index button {
  flex: none; scroll-snap-align: center; display: inline-flex; align-items: center; gap: 8px;
  border: 2px solid var(--line); background: var(--chip); border-radius: 99px;
  padding: 6px 14px 6px 8px; cursor: pointer; font: 600 0.95rem/1.2 var(--display);
}
.index .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; background: var(--line); color: var(--muted); }
.index button.seen .dot { background: var(--gold-soft); color: var(--gold); }
.index button[aria-current="step"] { border-color: var(--gold); }
.index button[aria-current="step"] .dot { background: var(--gold); color: var(--panel); }

/* Hilya panel */
.hilya {
  background: var(--panel);
  border-radius: 28px;
  padding: 10px;
  box-shadow: 0 10px 30px -12px color-mix(in srgb, var(--ink) 30%, transparent);
  position: relative;
}
.hilya-inner {
  border: 2px solid var(--gold);
  outline: 1px solid var(--gold); outline-offset: -8px;
  border-radius: 22px;
  padding: 18px 18px 14px;
  display: grid; justify-items: center; gap: 6px; text-align: center;
  position: relative; overflow: hidden;
}
.corner { position: absolute; width: 26px; height: 26px; color: var(--gold); opacity: .45; }
.corner svg { width: 100%; height: 100%; display: block; }
.c1 { top: 14px; left: 14px; } .c2 { top: 14px; right: 14px; } .c3 { bottom: 14px; left: 14px; } .c4 { bottom: 14px; right: 14px; }
.basmala { font: 400 1.25rem/1.6 var(--ar); color: var(--muted); }
.medallion {
  width: min(250px, 66vw); aspect-ratio: 1; max-width: 100%;
  border-radius: 50%;
  border: 3px solid var(--gold);
  box-shadow: inset 0 0 0 7px var(--panel), inset 0 0 0 9px var(--gold-soft);
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--gold-soft) 70%, var(--panel)), var(--panel) 72%);
  display: grid; place-items: center; align-content: center; gap: 2px;
  padding: 26px;
}
.medallion svg { width: 52%; height: auto; overflow: visible; }
/* Progress: one dot per station (after the intro) in a ring just outside the medallion, clockwise from the top. */
.medal-wrap { position: relative; padding: 11px; }
.ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.ring circle { fill: var(--line); transition: fill .4s; }
.ring circle.seen { fill: var(--gold); }
.ring circle.now { fill: var(--rose); }
.phrase { font: 700 clamp(1.25rem, 4.6vw, 1.6rem)/1.8 var(--ar); color: var(--ink); text-wrap: balance; }
.crescent { width: min(290px, 76vw); height: 26px; margin-top: -19px; color: var(--gold); }
.crescent svg { width: 100%; height: 100%; display: block; }
.station-name { font: 700 .8rem/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--rose); margin-top: 2px; }
.kid-title { font: 800 clamp(1.6rem, 6vw, 2.2rem)/1.1 var(--display); margin: 2px 0 0; text-wrap: balance; }
.kid-line { font-size: 1.12rem; max-width: 34ch; margin: 4px 0 6px; text-wrap: pretty; }
.verse { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 6px; width: 100%; display: grid; gap: 0; }
.verse [lang="ar"] { font-size: 1.2rem; color: var(--gold); }
.verse small { color: var(--muted); font-size: .82rem; }

/* Enter animation */
.stage.enter .medallion { animation: medIn .7s cubic-bezier(.2,.9,.25,1.2) both; }
.stage.enter .kid-title, .stage.enter .kid-line, .stage.enter .station-name { animation: rise .55s ease both; }
.stage.enter .kid-line { animation-delay: .08s; }
@keyframes medIn { from { transform: scale(.7) rotate(-25deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Icon idle motion */
.i-spin { transform-origin: 60px 60px; animation: spin 60s linear infinite; }
.i-glow { animation: glow 4s ease-in-out infinite; }
.i-twinkle { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.i-twinkle:nth-of-type(2) { animation-delay: .8s; } .i-twinkle:nth-of-type(3) { animation-delay: 1.6s; }
.i-sway { transform-origin: 60px 112px; animation: sway 6s ease-in-out infinite; }
.i-drop { animation: fall 1.8s ease-in infinite; }
.i-drop:nth-of-type(2) { animation-delay: .6s; } .i-drop:nth-of-type(3) { animation-delay: 1.2s; }
.i-spark { animation: float 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.i-spark:nth-of-type(2) { animation-delay: 1s; } .i-spark:nth-of-type(3) { animation-delay: 2s; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes glow { 50% { opacity: .55; } }
@keyframes twinkle { 50% { transform: scale(.4); opacity: .4; } }
@keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(3deg); } }
@keyframes fall { 0% { transform: translateY(-4px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
@keyframes float { 0% { transform: translateY(6px) scale(.6); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-22px) scale(1); opacity: 0; } }
/* Also stopped by the reduced-motion rule at the end. */
.i-flow { animation: flow 1.6s linear infinite; }
.i-bob { animation: bob 4s ease-in-out infinite; }
.i-bob:nth-of-type(2) { animation-delay: -1.3s; } .i-bob:nth-of-type(3) { animation-delay: -2.6s; }
.i-ripple { transform-box: fill-box; transform-origin: center; animation: ripple 3s ease-out infinite; }
.i-ripple:nth-of-type(2) { animation-delay: 1s; } .i-ripple:nth-of-type(3) { animation-delay: 2s; }
@keyframes flow { to { stroke-dashoffset: -18; } }
@keyframes bob { 50% { transform: translate(6px, -2px); } }
@keyframes ripple { 0% { transform: scale(.15); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(1); opacity: 0; } }

/* Chips */
.chips { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.chip {
  border: 2px solid var(--line); background: var(--chip); border-radius: 18px;
  padding: 10px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  font: 700 1rem/1.2 var(--display);
}
.chip .n { font: 700 .75rem/1 var(--body); background: var(--line); color: var(--muted); border-radius: 99px; padding: 3px 7px; }
.chip[aria-selected="true"] { border-color: var(--ink); background: var(--ink); color: var(--panel); }
.chip[aria-selected="true"] .n { background: var(--panel); color: var(--ink); }
.chip.c-char { --tint: var(--sage); } .chip.c-sign { --tint: var(--gold); } .chip.c-mirror { --tint: var(--lapis); }
.chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--tint); }

/* Cards */
.cards { display: grid; gap: 12px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  padding: 14px 16px; display: grid; gap: 6px; min-width: 0;
}
.card h3 { margin: 0; font: 700 1.2rem/1.25 var(--display); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card p { margin: 0; }
.card.research { border-style: dashed; background: transparent; }
.card.mirror { border-color: var(--lapis); border-style: dashed; }
.pill { font: 700 .7rem/1 var(--body); letter-spacing: .08em; text-transform: uppercase; border-radius: 99px; padding: 5px 9px; border: 1.5px solid currentColor; }
.k-mujiza { color: var(--gold); } .k-karama { color: var(--rose); } .k-khasisa { color: var(--lapis); }
.k-research { color: var(--muted); } .k-trait { color: var(--sage); }
.k-explain { color: var(--muted); font-size: .9rem; }
.group { display: grid; gap: 10px; }
.group + .group { margin-top: 8px; }
.group-head { margin: 0; }
.group > .k-explain { margin: -4px 0 0; }

/* Grown-up layer */
.adult { display: none; }
.grown .adult { display: grid; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: .88rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 2px; }
.badge { font: 700 .68rem/1 var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; background: var(--line); color: var(--ink); }
.badge.draft { background: var(--gold-soft); color: var(--gold); }
.cite { font-weight: 700; }
details { font-size: .95rem; }
details summary { cursor: pointer; color: var(--lapis); font-weight: 700; }
.src { display: grid; gap: 8px; padding-top: 8px; }
.src [lang="ar"] { font-size: 1.15rem; line-height: 1.9; }
.src .en { color: var(--ink); }
.note { font-size: .88rem; color: var(--rose); }
.adult-section { gap: 10px; }
.adult-section h2 { font: 800 1.3rem/1.2 var(--display); margin: 6px 0 0; }
.quote { display: grid; gap: 4px; }
.quote [lang="ar"] { font-size: 1.35rem; font-weight: 700; line-height: 1.95; }
.banner {
  border: 1.5px solid var(--gold); background: var(--gold-soft); color: var(--ink);
  border-radius: 14px; padding: 10px 14px; font-size: .92rem;
}

/* Footer nav */
.nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.nav button {
  border: 0; border-radius: 16px; padding: 12px 20px; cursor: pointer;
  font: 800 1.05rem/1 var(--display); background: var(--ink); color: var(--panel);
}
.nav button:disabled { opacity: .35; cursor: default; }
.nav .back { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.count { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.footnote { color: var(--muted); font-size: .85rem; text-align: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand"><h1>Little Hilya</h1><span lang="ar">حِلْيَة</span></div>
    <label class="toggle" for="grown">
      <input type="checkbox" id="grown">
      <span class="switch" aria-hidden="true"></span>

        <svg class="ring" id="ring" viewBox="0 0 100 100" aria-hidden="true"></svg>
        <div class="medallion">
          <div id="icon" aria-hidden="true"></div>
          <div class="phrase" lang="ar" id="phrase"></div>

      <div class="crescent" aria-hidden="true">
        <svg viewBox="0 0 290 26" preserveAspectRatio="none"><path d="M4 2 Q145 44 286 2 Q145 26 4 2Z" fill="currentColor"/></svg>
      </div>
      <div class="station-name" id="sname"></div>
      <h2 class="kid-title" id="ktitle"></h2>
      <p class="kid-line" id="kline"></p>
      <div class="verse">
        <span lang="ar">وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ</span>

  <div class="chips" role="tablist" id="chips"></div>

<script>
const TEXTS = {"shamail:2": {"ar": "حَدَّثَنَا حُمَيْدُ بْنُ مَسْعَدَةَ الْبَصْرِيُّ، قَالَ‏:‏ حَدَّثَنَا عَبْدُ الْوَهَّابِ الثَّقَفِيُّ، عَنْ حُمَيْدٍ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ‏:‏ كَانَ رَسُولُ اللهِ صلى الله عليه وسلم رَبْعَةً، لَيْسَ بِالطَّوِيلِ وَلا بِالْقَصِيرِ، حَسَنَ الْجِسْمِ، وَكَانَ شَعَرُهُ لَيْسَ بِجَعْدٍ، وَلا سَبْطٍ أَسْمَرَ اللَّوْنِ، إِذَا مَشَى يَتَكَفَّأُ‏.‏", "narrator": "Anas ibn Malik said:", "en": "‘Allah’s Messenger (Allah bless him and give him peace) was of medium height, neither tall nor short. He was of handsome physique, and his hair was neither crisply curled nor smooth. He was brown of complexion. When he walked, he used to stride confidently ”", "ch": 1, "ch_en": "The Noble Features Of Rasoolullah", "ch_ar": "باب ما جاء في خلق رسول الله صلى الله عليه وسلم", "corrected": [{"original": "his hair was neither crisply curled nor smooth, brown of color.", "replacement": "his hair was neither crisply curled nor smooth. He was brown of complexion.", "reason": "أَسْمَرَ اللَّوْنِ describes his complexion, not his hair. It is accusative like رَبْعَةً and حَسَنَ الْجِسْمِ, and the same hadith with the same isnad in Jāmi‘ al-Tirmidhī places أسمر اللون before the hair clause (dataset English there: “brown in complexion”)."}]}, "shamail:3": {"ar": "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، قَالَ‏:‏ حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، قَالَ‏:‏ حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي إِسْحَاقَ، قَالَ‏:‏ سَمِعْتُ الْبَرَاءَ بْنَ عَازِبٍ، يَقُولُ‏:‏ كَانَ رَسُولُ اللهِ صلى الله عليه وسلم، رَجُلا مَرْبُوعًا، بَعِيدَ مَا بَيْنَ الْمَنْكِبَيْنِ، عَظِيمَ الْجُمَّةِ إِلَى شَحْمَةِ أُذُنَيْهِ الْيُسْرَى، عَلَيْهِ حُلَّةٌ حَمْرَاءُ، مَا رَأَيْتُ شَيْئًا قَطُّ أَحْسَنَ مِنْهُ‏.‏", "narrator": "Abu Ishaq said:", "en": "“I heard al-Bara’ ibn 'Azib say:\n\"Allah’s Messenger(Allah bless him and give him peace)was neither curly nor lank-haired, of medium height, broad-shouldered, with luxuriant hair reaching the lobes of his ears, wearing a red suit of clothes. I have never seen anything more beautiful than him!”", "ch": 1, "ch_en": "The Noble Features Of Rasoolullah", "ch_ar": "باب ما جاء في خلق رسول الله صلى الله عليه وسلم", "corrected": [{"original": "Ibn Ishaq said:", "replacement": "Abu Ishaq said:", "reason": "The isnad reads عَنْ أَبِي إِسْحَاقَ (Abū Isḥāq), not Ibn Isḥāq."}]}, "shamail:5": {"ar": "حَدَّثَنَا مُحَمَّدُ بْنُ إِسْمَاعِيلَ، قَالَ‏:‏ حَدَّثَنَا أَبُو نُعَيْمٍ، قَالَ‏:‏ حَدَّثَنَا الْمَسْعُودِيُّ، عَنْ عُثْمَانَ بْنِ مُسْلِمِ بْنِ هُرْمُزَ، عَنْ نَافِعِ بْنِ جُبَيْرِ بْنِ مُطْعِمٍ، عَنْ عَلِيِّ بْنِ أَبِي طَالِبٍ، قَالَ‏:‏ لَمْ يَكُنِ النَّبِيُّ صلى الله عليه وسلم بِالطَّوِيلِ، وَلا بِالْقَصِيرِ، شَثْنُ الْكَفَّيْنِ وَالْقَدَمَيْنِ، ضَخْمُ الرَّأْسِ، ضَخْمُ الْكَرَادِيسِ، طَوِيلُ الْمَسْرُبَةِ، إِذَا مَشَى تَكَفَّأَ تَكَفُّؤًا، كَأَنَّمَا يَنْحَطُّ مِنْ صَبَبٍ، لَمْ أَرَ قَبْلَهُ، وَلا بَعْدَهُ مِثْلَهُ، صلى الله عليه وسلم‏.‏\n\nحَدَّثَنَا سُفْيَانُ بْنُ وَكِيعٍ، قَالَ‏:‏ حَدَّثَنَا أَبِي، عَنِ الْمَسْعُودِيِّ، بِهَذَا الإِسْنَادِ، نَحْوَهُ، بِمَعْنَاهُ‏.‏", "narrator": "Ali ibn Abi Talib said:", "en": "“The Prophet (Allah bless him and give him peace) was neither tall nor short, endowed with sturdy hands and feet, stout head and limbs, and lengthy hair on the chest. When he walked, he inclined forward, as if he were descending a downward slope. I have never seen the like of him, neither before him nor after him.”", "ch": 1, "ch_en": "The Noble Features Of Rasoolullah", "ch_ar": "باب ما جاء في خلق رسول الله صلى الله عليه وسلم"}, "shamail:6": {"ar": "حَدَّثَنَا أَحْمَدُ بْنُ عَبْدَةَ الضَّبِّيُّ الْبَصْرِيُّ، وَعَلِيُّ بْنُ حُجْرٍ، وَأَبُو جَعْفَرٍ مُحَمَّدُ بْنُ الْحُسَيْنِ وَهُوَ ابْنُ أَبِي حَلِيمَةَ، وَالْمَعْنَى وَاحِدٌ، قَالُوا‏:‏ حَدَّثَنَا عِيسَى بْنُ يُونُسَ، عَنْ عُمَرَ بْنِ عَبْدِ اللهِ مَوْلَى غُفْرَةَ، قَالَ‏:‏ حَدَّثَنِي إِبْرَاهِيمُ بْنُ مُحَمَّدٍ مِنْ وَلَدِ عَلِيِّ بْنِ أَبِي طَالِبٍ، قَالَ‏:‏ كَانَ عَلِيٌّ إِذَا وَصَفَ رَسُولَ اللهِ صلى الله عليه وسلم، قَالَ‏:‏ لَمْ يَكُنْ رَسُولُ اللهِ صلى الله عليه وسلم بِالطَّوِيلِ الْمُمَّغِطِ، وَلا بِالْقَصِيرِ الْمُتَرَدِّدِ، وَكَانَ رَبْعَةً مِنَ الْقَوْمِ، لَمْ يَكُنْ بِالْجَعْدِ الْقَطَطِ، وَلا بِالسَّبْطِ، كَانَ جَعْدًا رَجِلا، وَلَمْ يَكُنْ بِالْمُطَهَّمِ، وَلا بِالْمُكَلْثَمِ، وَكَانَ فِي وَجْهِهِ تَدْوِيرٌ، أَبْيَضُ مُشَرَبٌ، أَدْعَجُ الْعَيْنَيْنِ، أَهْدَبُ الأَشْفَارِ، جَلِيلُ الْمُشَاشِ وَالْكَتَدِ، أَجْرَدُ، ذُو مَسْرُبَةٍ، شَثْنُ الْكَفَّيْنِ وَالْقَدَمَيْنِ، إِذَا مَشَى كَأَنَّمَا يَنْحَطُّ فِي صَبَبٍ، وَإِذَا الْتَفَتَ الْتَفَتَ مَعًا، بَيْنَ كَتِفَيْهِ خَاتَمُ النُّبُوَّةِ، وَهُوَ خَاتَمُ النَّبِيِّينَ، أَجْوَدُ النَّاسِ صَدْرًا، وَأَصْدَقُ النَّاسِ لَهْجَةً، وَأَلْيَنُهُمْ عَرِيكَةً، وَأَكْرَمُهُمْ عِشْرَةً، مَنْ رَآهُ بَدِيهَةً هَابَهُ، وَمَنْ خَالَطَهُ مَعْرِفَةً أَحَبَّهُ، يَقُولُ نَاعِتُهُ‏:‏ لَمْ أَرَ قَبْلَهُ، وَلا بَعْدَهُ مِثْلَهُ صلى الله عليه وسلم‏.‏", "narrator": "On the authority of 'Umar ibn 'Abdi’llah, the Mawla of Ghufra:", "en": "1 have been told by Ibrahim ibn Muhammad, one of the offspring of 'Ali ibn Abi Talib (may Allah be well pleased with him): “When 'Ali described Allah’s Messenger (Allah bless him and give him peace),he said:\n\"Allah’s Messenger (Allah bless him and give him peace) was neither assertively tall, nor reticently short, and he was an average-sized member of the population. His hair was neither crisply curled nor lank; it was loosely curled. He was neither plump nor chubby-cheeked, and in his face there was a rounded quality. He was white with a reddish tinge, dark black-eyed, with long eyelashes. He had splendid kneecaps, elbow joints and shoulder blades, free from hair. He had a strip of hair from the top of the chest to the navel. The palms of his hands and the soles of his feet were thickset. When he walked, he moved as if he were descending a declivity, and when he looked around, he looked around altogether. Between his shoulders was the Seal of Prophethood, for he is the Seal of the Prophets. He was the best of the people in generosity, the most truthful of the people in speech, the gentlest of them in temperament, and the noblest of them in social intercourse. If someone saw him unexpectedly, he was awestruck by him, and if someone came to know him, he loved him. His describer says: “I have never seen the like of him (Allah bless him and give him peace), neither before him nor after him.”", "ch": 1, "ch_en": "The Noble Features Of Rasoolullah", "ch_ar": "باب ما جاء في خلق رسول الله صلى الله عليه وسلم"}, "shamail:7": {"ar": "حَدَّثَنَا سُفْيَانُ بْنُ وَكِيعٍ، قَالَ‏:‏ حَدَّثَنَا جُمَيْعُ بْنُ عُمَرَ بْنِ عَبْدِ الرَّحْمَنِ الْعِجْلِيُّ، إِمْلاءً عَلَيْنَا مِنْ كِتَابِهِ، قَالَ‏:‏ أَخْبَرَنِي رَجُلٌ مِنْ بَنِي تَمِيمٍ، مِنْ وَلَدِ أَبِي هَالَةَ زَوْجِ خَدِيجَةَ، يُكَنَى أَبَا عَبْدِ اللهِ، عَنِ ابْنٍ لأَبِي هَالَةَ، عَنِ الْحَسَنِ بْنِ عَلِيٍّ، قَالَ‏:‏ سَأَلْتُ خَالِي هِنْدَ بْنَ أَبِي هَالَةَ، وَكَانَ وَصَّافًا، عَنْ حِلْيَةِ رَسُولِ اللهِ صلى الله عليه وسلم، وَأَنَا أَشْتَهِي أَنْ يَصِفَ لِي مِنْهَا شَيْئًا أَتَعَلَّقُ بِهِ، فَقَالَ‏:‏ كَانَ رَسُولُ اللهِ صلى الله عليه وسلم فَخْمًا مُفَخَّمًا، يَتَلأْلأُ وَجْهُهُ، تَلأْلُؤَ الْقَمَرِ لَيْلَةَ الْبَدْرِ، أَطْوَلُ مِنَ الْمَرْبُوعِ، وَأَقْصَرُ مِنَ الْمُشَذَّبِ، عَظِيمُ الْهَامَةِ، رَجِلُ الشَّعْرِ، إِنِ انْفَرَقَتْ عَقِيقَتُهُ فَرَّقَهَا، وَإِلا فَلا يُجَاوِزُ شَعَرُهُ شَحْمَةَ أُذُنَيْهِ، إِذَا هُوَ وَفَّرَهُ، أَزْهَرُ اللَّوْنِ، وَاسِعُ الْجَبِينِ، أَزَجُّ الْحَوَاجِبِ، سَوَابِغَ فِي غَيْرِ قَرَنٍ، بَيْنَهُمَا عِرْقٌ، يُدِرُّهُ الْغَضَبُ، أَقْنَى الْعِرْنَيْنِ، لَهُ نُورٌ يَعْلُوهُ، يَحْسَبُهُ مَنْ لَمْ يَتَأَمَّلْهُ أَشَمَّ، كَثُّ اللِّحْيَةِ، سَهْلُ الْخدَّيْنِ، ضَلِيعُ الْفَمِ، مُفْلَجُ الأَسْنَانِ، دَقِيقُ الْمَسْرُبَةِ، كَأَنَّ عُنُقَهُ جِيدُ دُمْيَةٍ، فِي صَفَاءِ الْفِضَّةِ، مُعْتَدِلُ الْخَلْقِ، بَادِنٌ مُتَمَاسِكٌ، سَوَاءُ الْبَطْنِ وَالصَّدْرِ، عَرِيضُ الصَّدْرِ، بَعِيدُ مَا بَيْنَ الْمَنْكِبَيْنِ، ضَخْمُ الْكَرَادِيسِ، أَنْوَرُ الْمُتَجَرَّدِ، مَوْصُولُ مَا بَيْنَ اللَّبَّةِ وَالسُّرَّةِ بِشَعَرٍ يَجْرِي كَالْخَطِّ، عَارِي الثَّدْيَيْنِ وَالْبَطْنِ مِمَّا سِوَى ذَلِكَ، أَشْعَرُ الذِّرَاعَيْنِ، وَالْمَنْكِبَيْنِ، وَأَعَالِي الصَّدْرِ، طَوِيلُ الزَّنْدَيْنِ، رَحْبُ الرَّاحَةِ، شَثْنُ الْكَفَّيْنِ وَالْقَدَمَيْنِ، سَائِلُ الأَطْرَافِ أَوْ قَالَ‏:‏ شَائِلُ الأَطْرَافِ خَمْصَانُ الأَخْمَصَيْنِ، مَسِيحُ الْقَدَمَيْنِ، يَنْبُو عَنْهُمَا الْمَاءُ، إِذَا زَالَ، زَالَ قَلِعًا، يَخْطُو تَكَفِّيًا، وَيَمْشِي هَوْنًا، ذَرِيعُ الْمِشْيَةِ، إِذَا مَشَى كَأَنَّمَا يَنْحَطُّ مِنْ صَبَبٍ، وَإِذَا الْتَفَتَ الْتَفَتَ جَمِيعًا، خَافِضُ الطَّرْفِ، نَظَرُهُ إِلَى الأَرْضِ، أَطْوَلُ مِنْ نَظَرِهِ إِلَى السَّمَاءِ، جُلُّ نَظَرِهِ الْمُلاحَظَةُ، يَسُوقُ أَصْحَابَهُ، وَيَبْدَأُ مَنْ لَقِيَ بِالسَّلامِ‏.‏", "narrator": "Al-Hasan ibn 'Ali (may Allah be well pleased with him and his father) said:", "en": "“I asked my maternal uncle Hind, the son of Abu Hala, who was a describer of the finery of Allah’s Messenger (Allah bless him and give him peace), to describe something of it that would be of interest to me, so he said:\nAllah’s Messenger (Allah bless him and give him peace) was an honored dignitary, whose face shone with the radiance of the moon on the night of the full moon. He was taller than medium-sized, and shorter than the slender giant. His head was grand and impressive, with loosely curled hair. If his forelock became divided, he would part it. Otherwise his hair would not cross over his earlobes, and he would let it grow plentiful and long. He was bright of color, broad of forehead, endowed with arched eyebrows, perfect without being conjoined, with a vein between them that anger would cause to pulsate. The bridge of his nose was curved. He had a light that would rise over him, and someone who did not reflect on him would consider him haughty. He was thickly bearded, endowed with smooth cheeks, a wide mouth, cleft teeth, and a delicate strip of hair from the top of the chest to the navel. It was as if his neck were the neck of a statue shaped in pure silver. He was well proportioned in physique, firmly cohesive, with the stomach and the breast in even balance. He was wide-chested, broad-shouldered, endowed with stout limbs and very shiny bare skin. Between the top of the chest and the navel by a strip of hair like a line of writing, while his breasts and stomach were bare apart from that. He had hair on his arms and shoulders and the upper parts of his chest. His forearms were long. He had a sensitive touch of the hand. The palms of his hands and the soles of his feet were thickset. His extremities were well formed . The hollows of his soles were very deep-set. His feet were so smooth that water bounced off them. When he left a place, he would go away striding decisively. He would tread inclining forward and walk comfortably. His gait was brisk. When he walked, it was as if he were descending a declivity, and when he looked around, he looked around altogether. He lowered his eyesight, and he spent more time looking at the ground than he did looking at the sky. The majority of his looking was observation. He would urge his Companions to proceed ahead of him, and he would be the first to greet anyone he encountered with the salutation of peace.”", "ch": 1, "ch_en": "The Noble Features Of Rasoolullah", "ch_ar": "باب ما جاء في خلق رسول الله صلى الله عليه وسلم", "corrected": [{"original": "My maternal aunt Hind asked the son of Abu Hala", "replacement": "I asked my maternal uncle Hind, the son of Abu Hala", "reason": "سَأَلْتُ خَالِي هِنْدَ بْنَ أَبِي هَالَةَ: al-Ḥasan is the one asking (سألتُ, “I asked”), and خالي is “my maternal uncle”. Hind ibn Abī Hāla is a man, Khadīja’s son and so al-Ḥasan’s uncle."}]}, "shamail:9": {"ar": "حَدَّثَنَا هَنَّادُ بْنُ السَّرِيِّ، قَالَ‏:‏ حَدَّثَنَا عَبْثَرُ بْنُ الْقَاسِمِ، عَنْ أَشْعَثَ يَعْنِي ابْنَ سَوَّارٍ، عَنْ أَبِي إِسْحَاقَ، عَنْ جَابِرِ بْنِ سَمُرَةَ، قَالَ‏:‏ رَأَيْتُ رَسُولَ اللهِ صلى الله عليه وسلم، فِي لَيْلَةٍ إِضْحِيَانٍ، وَعَلَيْهِ حُلَّةٌ حَمْرَاءُ، فَجَعَلْتُ أَنْظُرُ إِلَيْهِ وَإِلَى الْقَمَرِ، فَلَهُوَ عِنْدِي أَحْسَنُ مِنَ الْقَمَرِ‏.‏", "narrator": "Jabir ibn Samura said:", "en": "\"I saw Allah’s Messenger (Allah bless him and give him peace) on a cloudless night, and he was wearing a red suit of clothes, so I started looking at him as well as at the moon, for he is indeed more beautiful, in my opinion, than the moon!”", "ch": 1, "ch_en": "The Noble Features Of Rasoolullah", "ch_ar": "باب ما جاء في خلق رسول الله صلى الله عليه وسلم"}, "shamail:10": {"ar": "حَدَّثَنَا سُفْيَانُ بْنُ وَكِيعٍ، حَدَّثَنَا حُمَيْدُ بْنُ عَبْدِ الرَّحْمَنِ الرُّؤَاسِيُّ، عَنْ زُهَيْرٍ، عَنْ أَبِي إِسْحَاقَ، قَالَ‏:‏ سَأَلَ رَجُلٌ الْبَرَاءَ بْنَ عَازِبٍ‏:‏ أَكَانَ وَجْهُ رَسُولِ اللهِ صلى الله عليه وسلم مِثْلَ السَّيْفِ‏؟‏ قَالَ‏:‏ لا، بَلْ مِثْلَ الْقَمَرِ‏.‏", "narrator": "Abu Ishaq said:", "en": "A man asked al-Bara’ ibn 'Azib: “Was the face of Allah’s Messenger (Allah bless him and give him peace) like the sword?” He said: “No, it was rather like the moon!”", "ch": 1, "ch_en": "The Noble Features Of Rasoolullah", "ch_ar": "باب ما جاء في خلق رسول الله صلى الله عليه وسلم"}, "shamail:11": {"ar": "حَدَّثَنَا أَبُو دَاوُدَ الْمَصَاحِفِيُّ سُلَيْمَانُ بْنُ سَلْمٍ، قَالَ‏:‏ حَدَّثَنَا النَّضْرُ بْنُ شُمَيْلٍ، عَنْ صَالِحِ بْنِ أَبِي الأَخْضَرِ، عَنِ ابْنِ شِهَابٍ، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ‏:‏ كَانَ رَسُولُ اللهِ صلى الله عليه وسلم أَبْيَضَ كَأَنَّمَا صِيغَ مِنْ فِضَّةٍ، رَجِلَ الشَّعْرِ‏.‏", "narrator": "Abu Huraira (may Allah be well pleased with him) said:", "en": "\"Allah’s Messenger (Allah bless him and give him peace) was white, as if he were fashioned from silver, with loosely curled hair.\"", "ch": 1, "ch_en": "The Noble Features Of Rasoolullah", "ch_ar": "باب ما جاء في خلق رسول الله صلى الله عليه وسلم"}, "shamail:14": {"ar": "حَدَّثَنَا عَبْدُ اللهِ بْنُ عَبْدِ الرَّحْمَنِ، قَالَ‏:‏ حَدَّثَنَا إِبْرَاهِيمُ بْنُ الْمُنْذِرِ الْحِزَامِيُّ، قَالَ‏:‏ حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ أَبِي ثَابِتٍ الزُّهْرِيُّ، قَالَ‏:‏ حَدَّثَنِي إِسْمَاعِيلُ بْنُ إِبْرَاهِيمَ ابْنُ أَخِي مُوسَى بْنِ عُقْبَةَ، عَنْ مُوسَى بْنِ عُقْبَةَ، عَنْ كُرَيْبٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ‏:‏ كَانَ رَسُولُ اللهِ صلى الله عليه وسلم أَفْلَجَ الثَّنِيَّتَيْنِ، إِذَا تَكَلَّمَ رُئِيَ كَالنُّورِ يَخْرُجُ مِنْ بَيْنِ ثَنَايَاهُ‏.‏", "narrator": "Ibn 'Abbas said:", "en": "Allah’s Messenger (Allah bless him and give him peace) had a gap between the medial pair of teeth. When he spoke, it seemed as if light were emerging from between his middle teeth.\"", "ch": 1, "ch_en": "The Noble Features Of Rasoolullah", "ch_ar": "باب ما جاء في خلق رسول الله صلى الله عليه وسلم"}, "shamail:15": {"ar": "حَدَّثَنَا أَبُو رَجَاءٍ قُتَيْبَةُ بْنُ سَعِيدٍ، قَالَ‏:‏ حَدَّثَنَا حَاتِمُ بْنُ إِسْمَاعِيلَ، عَنِ الْجَعْدِ بْنِ عَبْدِ الرَّحْمَنِ، قَالَ‏:‏ سَمِعْتُ السَّائِبَ بْنَ يَزِيدَ، يَقُولُ‏:‏ ذَهَبَتْ بِي خَالَتِي إِلَى النَّبِيِّ صلى الله عليه وسلم، فَقَالَتْ‏:‏ يَا رَسُولَ اللهِ، إِنَّ ابْنَ أُخْتِي وَجِعٌ فَمَسَحَ رَأْسِي وَدَعَا لِي بِالْبَرَكَةِ، وَتَوَضَّأَ، فَشَرِبْتُ مِنْ وَضُوئِهِ، وَقُمْتُ خَلْفَ ظَهْرِهِ، فَنَظَرْتُ إِلَى الْخَاتَمِ بَيْنَ كَتِفَيْهِ، فَإِذَا هُوَ مِثْلُ زِرِّ الْحَجَلَةِ‏.‏", "narrator": "As-Sa’ib ibn Yazid said:", "en": "‘My maternal aunt took me to the Prophet (Allah bless him and give him peace), and she said; “O Messenger of Allah, my sister's son is in pain!” He therefore stroked my head (Allah bless him and give him peace) and supplicated blessing for my sake. He performed the minor ritual ablution. I drank from his ablution water and stood behind his back, whereupon I observed the Seal between his shoulders, and lo and behold, it was like the button of the bridal canopy!”’", "ch": 2, "ch_en": "Seal Of Nubuwwah (Prophethood) Of Rasoolullah", "ch_ar": "باب ما جاء في خاتم النبوة"}, "shamail:16": {"ar": "حَدَّثَنَا سَعِيدُ بْنُ يَعْقُوبَ الطَّالْقَانِيُّ، قَالَ‏:‏ حدَّثَنَا أَيُّوبُ بْنُ جَابِرٍ، عَنْ سِمَاكِ بْنِ حَرْبٍ، عَنْ جَابِرِ بْنِ سَمُرَةَ، قَالَ‏:‏ رَأَيْتُ الْخَاتَمَ بَيْنَ كَتِفَيْ رَسُولِ اللهِ صلى الله عليه وسلم، غُدَّةً حَمْرَاءَ، مِثْلَ بَيْضَةِ الْحَمَامَةِ‏.‏", "narrator": "Jabir ibn Samura said:", "en": "\"I saw the Seal between the shoulders of Allah’s Messenger (Allah bless him and give him peace) as a red swelling like the egg of the dove.”", "ch": 2, "ch_en": "Seal Of Nubuwwah (Prophethood) Of Rasoolullah", "ch_ar": "باب ما جاء في خاتم النبوة"}, "shamail:18": {"ar": "حَدَّثَنَا أَحْمَدُ بْنُ عَبْدَةَ الضَّبِّيُّ، وَعَلِيُّ بْنُ حُجْرٍ، وَغَيْرُ وَاحِدٍ، قَالُوا‏:‏ حَدَّثَنَا عِيسَى بْنُ يُونُسَ، عَنْ عُمَرَ بْنِ عَبْدِ اللهِ مَوْلَى غُفْرَةَ، قَالَ‏:‏ حَدَّثَنِي إِبْرَاهِيمُ بْنُ مُحَمَّدٍ مِنْ وَلَدِ عَلِيِّ بْنِ أَبِي طَالِبٍ، قَالَ‏:‏ كَانَ عَلِيٌّ، إِذَا وَصَفَ رَسُولَ اللهِ صلى الله عليه وسلم فَذَكَرَ الْحَدِيثَ بِطُولِهِ، وَقَالَ‏:‏ بَيْنَ كَتِفَيْهِ خَاتَمُ النُّبُوَّةِ، وَهُوَ خَاتَمُ النَّبِيِّينَ‏.‏", "narrator": "Ibrahim ibn Muhammad, one of the offspring of 'Ali ibn Abi Talib, told me:", "en": "“When 'Ali described Allah’s Messenger (Allah bless him and give him peace)— then he related the tradition in full—he said: 'Between his shoulders was the Seal of Prophethood, for he is the Seal of the Prophets'.\"", "ch": 2, "ch_en": "Seal Of Nubuwwah (Prophethood) Of Rasoolullah", "ch_ar": "باب ما جاء في خاتم النبوة"}, "shamail:19": {"ar": "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، قَالَ‏:‏ حَدَّثَنَا أَبُو عَاصِمٍ، قَالَ‏:‏ حَدَّثَنَا عَزْرَةُ بْنُ ثَابِتٍ، قَالَ‏:‏ حَدَّثَنِي عِلْبَاءُ بْنُ أَحْمَرَ الْيَشْكُرِيُّ، قَالَ‏:‏ حَدَّثَنِي أَبُو زَيْدٍ عَمْرُو بْنُ أَخْطَبَ الأَنْصَارِيُّ، قَالَ‏:‏ قَالَ لِي رَسُولُ اللهِ صلى الله عليه وسلم‏:‏ يَا أَبَا زَيْدٍ، ادْنُ مِنِّي فَامْسَحْ ظَهْرِي، فَمَسَحْتُ ظَهْرَهُ، فَوَقَعَتْ أَصَابِعِي عَلَى الْخَاتَمِ قُلْتُ‏:‏ وَمَا الْخَاتَمُ‏؟‏ قَالَ‏:‏ شَعَرَاتٌ مُجْتَمِعَاتٌ‏.‏", "narrator": "Abu Zaid 'Amr ibn Akhtab al-Ansari told me:", "en": "“Allah’s Messenger (Allah bless him and give him peace) said to me: ‘O Abu Zaid, come close to me and stroke my back!’ I duly stroked his back, whereupon my fingers touched the Seal. I said: ‘What is the Seal?’ He said; ‘Intertwined hairs.’”", "ch": 2, "ch_en": "Seal Of Nubuwwah (Prophethood) Of Rasoolullah", "ch_ar": "باب ما جاء في خاتم النبوة"}, "shamail:20": {"ar": "حَدَّثَنَا أَبُو عَمَّارٍ الْحُسَيْنُ بْنُ حُرَيْثٍ الْخُزَاعِيُّ، قَالَ‏:‏ حَدَّثَنَا عَلِيُّ بْنُ حُسَيْنِ بْنِ وَاقِدٍ، حَدَّثَنِي أَبِي، قَالَ‏:‏ حَدَّثَنِي عَبْدُ اللهِ بْنُ بُرَيْدَةَ، قَالَ‏:‏ سَمِعْتُ أَبِي بُرَيْدَةَ، يَقُولُ‏:‏ جَاءَ سَلْمَانُ الْفَارِسِيُّ إِلَى رَسُولِ اللهِ صلى الله عليه وسلم، حِينَ قَدِمَ الْمَدِينَةَ بِمَائِدَةٍ عَلَيْهَا رُطَبٌ، فَوَضَعَهَا بَيْنَ يَدَيْ رَسُولِ اللهِ صلى الله عليه وسلم، فَقَالَ‏:‏ يَا سَلْمَانُ مَا هَذَا‏؟‏ فَقَالَ‏:‏ صَدَقَةٌ عَلَيْكَ، وَعَلَى أَصْحَابِكَ، فَقَالَ‏:‏ ارْفَعْهَا، فَإِنَّا لا نَأْكُلُ الصَّدَقَةَ، قَالَ‏:‏ فَرَفَعَهَا، فَجَاءَ الْغَدَ بِمِثْلِهِ، فَوَضَعَهُ بَيْنَ يَدَيْ رَسُولِ اللهِ صلى الله عليه وسلم، فَقَالَ‏:‏ مَا هَذَا يَا سَلْمَانُ‏؟‏ فَقَالَ‏:‏ هَدِيَّةٌ لَكَ، فَقَالَ رَسُولُ اللهِ صلى الله عليه وسلم لأَصْحَابِهِ‏:‏ ابْسُطُوا ثُمَّ نَظَرَ إِلَى الْخَاتَمِ عَلَى ظَهْرِ رَسُولِ اللهِ صلى الله عليه وسلم، فَآمَنَ بِهِ، وَكَانَ لِلْيَهُودِ فَاشْتَرَاهُ رَسُولُ اللهِ صلى الله عليه وسلم، بِكَذَا وَكَذَا دِرْهَمًا عَلَى أَنْ يَغْرِسَ لَهُمْ نَخْلا، فَيَعْمَلَ سَلْمَانُ فِيهِ، حَتَّى تُطْعِمَ، فَغَرَسَ رَسُولُ اللهِ صلى الله عليه وسلم، النَّخلَ إِلا نَخْلَةً وَاحِدَةً، غَرَسَهَا عُمَرُ فَحَمَلَتِ النَّخْلُ مِنْ عَامِهَا، وَلَمْ تَحْمِلْ نَخْلَةٌ، فَقَالَ رَسُولُ اللهِ صلى الله عليه وسلم‏:‏ مَا شَأْنُ هَذِهِ النَّخْلَةِ‏؟‏ فَقَالَ عُمَرُ‏:‏ يَا رَسُولَ اللهِ، أَنَا غَرَسْتُهَا، فَنَزَعَهَا رَسُولُ اللهِ صلى الله عليه وسلم، فَغَرَسَهَا فَحَمَلَتْ مِنْ عَامِهَا‏.‏", "narrator": "Abu Buraida said:", "en": "“Salman al-Farisi brought Allah’s Messenger (Allah bless him and give him peace), when he reached Medina, a table with ripe dates upon it, and he placed it in front of Allah’s Messenger (Allah bless him and give him peace), so he said: ‘O Salman, what is this?’ He replied: A charitable gift for you and for your Companions’ ‘Take it away,’ said the Prophet, ‘for we will not eat a charitable gift.’ He therefore took it away. Then he came the next day with the like of it, and placed it in front of Allah’s Messenger (Allah bless him and give him peace), who said: ‘What is this, O Salman?’ He replied: ‘A present for you,’ so Allah’s Messenger (Allah bless him and give him peace) said to his Companions: ‘Spread out!’ Then Salman looked at the Seal on the back of Allah’s Messenger (Allah bless him and give him peace), so he believed in him. He was a slave of the Jews, however, so Allah’s Messenger (Allah bless him and give him peace) purchased his freedom at such-and-such a price of silver coin, on condition that he  would plant date palms for them, and Salman would work on them until they bore edible fruit. Allah’s Messenger (Allah bless him and give him peace) then planted the date palms, apart from one date palm that 'Umar planted. The date palms then bore fruit that same year, but one date palm did not bear fruit, so Allah’s Messenger said (Allah bless him and give him peace): ‘What is the matter with this date palm?’ 'Umar said: ‘O Messenger of Allah, I planted it!’ Allah’s Messenger (Allah bless him and give him peace) therefore uprooted it and replanted it, so it bore fruit that same year.\"", "ch": 2, "ch_en": "Seal Of Nubuwwah (Prophethood) Of Rasoolullah", "ch_ar": "باب ما جاء في خاتم النبوة", "corrected": [{"original": "The date palms then bore their annual crop,", "replacement": "The date palms then bore fruit that same year,", "reason": "فَحَمَلَتِ النَّخْلُ مِنْ عَامِهَا: مِنْ عَامِهَا means “in that same year” (date palms normally take years to fruit), which is the point of the report."}, {"original": "so it bore its annual crop.", "replacement": "so it bore fruit that same year.", "reason": "فَحَمَلَتْ مِنْ عَامِهَا: “it bore fruit in that same year”, not “its annual crop”."}]}, "shamail:22": {"ar": "حَدَّثَنَا أَحْمَدُ بْنُ الْمِقْدَامِ أَبُو الأَشْعَثِ الْعِجْلِيُّ الْبَصْرِيُّ، قَالَ‏:‏ أَخْبَرَنَا حَمَّادُ بْنُ زَيْدٍ، عَنْ عَاصِمٍ الأَحْوَلِ، عَنْ عَبْدِ اللهِ بْنِ سَرْجِسَ، قَالَ‏:‏ أَتَيْتُ رَسُولَ اللهِ صلى الله عليه وسلم وَهُوَ فِي نَاسٍ مِنْ أَصْحَابِهِ، فَدُرْتُ هَكَذَا مِنْ خَلْفِهِ، فَعَرَفَ الَّذِي أُرِيدُ، فَأَلْقَى الرِّدَاءَ عَنْ ظَهْرِهِ، فَرَأَيْتُ مَوْضِعَ الْخَاتَمِ عَلَى كَتِفَيْهِ، مِثْلَ الْجُمْعِ حَوْلَهَا خِيلانٌ، كَأَنَّهَا ثَآلِيلُ، فَرَجَعْتُ حَتَّى اسْتَقْبَلْتُهُ، فَقُلْتُ‏:‏ غَفَرَ اللَّهُ لَكَ يَا رَسُولَ اللهِ، فَقَالَ‏:‏ وَلَكَ فَقَالَ الْقَوْمُ‏:‏ أَسْتَغْفَرَ لَكَ رَسُولُ اللهِ صلى الله عليه وسلم‏؟‏ فَقَالَ‏:‏ نَعَمْ، وَلَكُمْ، ثُمَّ تَلا هَذِهِ الآيَةَ ﴿وَاسْتَغْفِرْ لِذَنْبِكَ وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ﴾", "narrator": "'Abdullah ibn Sarjis  said:", "en": "\"I came to Allah’s Messenger (Allah bless him and give him peace), while he was among a group of his Companions, so I circled like this behind him. He understood what I wanted, so he threw the cloak off his back. I thus saw the place of the Seal on his shoulders, like a clenched fist surrounded by moles, as if they were warts. I came around to face him, and I said: 'May Allah forgive you, O Messenger of Allah!' He said: ‘And you,' so the people exclaimed: 'Allah’s Messenger (Allah bless him and give him peace) has asked forgiveness for you!' He said: 'Yes, and also for you!' Then he recited this Quranic verse: 'And ask forgiveness for your sin, and for the believing men and the believing women .”(Q.47:19).”’", "ch": 2, "ch_en": "Seal Of Nubuwwah (Prophethood) Of Rasoolullah", "ch_ar": "باب ما جاء في خاتم النبوة"}, "shamail:26": {"ar": "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، قَالَ‏:‏ حَدَّثَنَا وَهْبُ بْنُ جَرِيرِ بْنِ حَازِمٍ، قَالَ‏:‏ حَدَّثَنِي أَبِي، عَنْ قَتَادَةَ، قَالَ‏:‏ قُلْتُ لأَنَسٍ‏:‏ كَيْفَ كَانَ شَعَرُ رَسُولِ اللهِ صلى الله عليه وسلم‏؟‏ قَالَ‏:‏ لَمْ يَكُنْ بِالْجَعْدِ، وَلا بِالسَّبْطِ، كَانَ يَبْلُغُ شَعَرُهُ شَحْمَةَ أُذُنَيْهِ‏.‏", "narrator": "Qatada said:", "en": "“I said to Anas: ‘How was the hair of Allah’s Messenger (Allah bless him and give him peace)?' He replied: 'It was neither crisply curled nor lank. His hair used to reach the lobes of his ears'.”", "ch": 3, "ch_en": "The Mubarak Hair Of Rasoolullah", "ch_ar": "باب ما جاء في شعر رسول الله صلى الله عليه وسلم"}, "shamail:30": {"ar": "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، قَالَ‏:‏ حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، عَنْ إِبْرَاهِيمَ بْنِ نَافِعٍ الْمَكِّيِّ، عَنِ ابْنِ أَبِي نَجِيحٍ، عَنْ مُجَاهِدٍ، عَنْ أُمِّ هَانِئٍ، قَالَتْ‏:‏ رَأَيْتُ رَسُولَ اللهِ صلى الله عليه وسلم ذَا ضَفَائِرَ أَرْبَعٍ‏.‏", "narrator": "Umm Hani said:", "en": "\"I saw Allah’s Messenger (Allah bless him and give him peace) with four braids of hair.”", "ch": 3, "ch_en": "The Mubarak Hair Of Rasoolullah", "ch_ar": "باب ما جاء في شعر رسول الله صلى الله عليه وسلم"}, "shamail:32": {"ar": "حَدَّثَنَا يُوسُفُ بْنُ عِيسَى، قَالَ‏:‏ حَدَّثَنَا وَكِيعٌ، قَالَ‏:‏ حَدَّثَنَا الرَّبِيعُ بْنُ صَبِيحٍ، عَنْ يَزِيدَ بْنِ أَبَانَ هُوَ الرَّقَاشِيُّ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ‏:‏ كَانَ رَسُولُ اللهِ صلى الله عليه وسلم يُكْثِرُ دَهْنَ رَأْسِهِ وَتَسْرِيحَ لِحْيَتِهِ، وَيُكْثِرُ الْقِنَاعَ حَتَّى كَأَنَّ ثَوْبَهُ، ثَوْبُ زَيَّاتٍ‏.‏", "narrator": "Anas ibn Malik said:", "en": "“Allah’s Messenger (Allah bless him and give him peace) made a frequent practice of oiling his head and combing his beard, and he often wore the head veil, so it was as if his\nrobe was the robe of an oil dealer.”", "ch": 4, "ch_en": "The Combing Of The Hair Of Rasoolullah", "ch_ar": "باب ما جاء في ترجل رسول الله صلى الله عليه وسلم"}, "shamail:37": {"ar": "حَدَّثَنَا إِسْحَاقُ بْنُ مَنْصُورٍ، وَيَحْيَى بْنُ مُوسَى، قَالا‏:‏ حَدَّثَنَا عَبْدُ الرَّزَّاقِ، عَنْ مَعْمَرٍ، عَنْ ثَابِتٍ، عَنْ أَنَسٍ، قَالَ‏:‏ مَا عَدَدْتُ فِي رَأْسِ رَسُولِ اللهِ صلى الله عليه وسلم وَلِحْيَتِهِ، إِلا أَرْبَعَ عَشْرَةَ شَعَرَةً بَيْضَاءَ‏.‏", "narrator": "Anas ibn Malik said:", "en": "\"On the head of Allah’s Messenger (Allah bless him and give him peace) and his beard, I counted only fourteen white hairs.”", "ch": 5, "ch_en": "Appearing Of The White Hair Of Rasoolullah", "ch_ar": "باب ما جاء في شيب رسول الله صلى الله عليه وسلم"}, "shamail:41": {"ar": "حَدَّثَنَا سُفْيَانُ بْنُ وَكِيعٍ، قَالَ‏:‏ حَدَّثَنَا مُحَمَّدُ بْنُ بِشْرٍ، عَنْ عَلِيِّ بْنِ صَالِحٍ، عَنْ أَبِي إِسْحَاقَ، عَنْ أَبِي جُحَيْفَةَ، قَالَ‏:‏ قَالُوا‏:‏ يَا رَسُولَ اللهِ، نَرَاكَ قَدْ شِبْتَ، قَالَ‏:‏ قَدْ شَيَّبَتْنِي هُودٌ وَأَخَوَاتُهَا‏.‏", "narrator": "Abu Juhaifa said:", "en": "\"O Messenger of Allah we notice that you have turned gray!’ He said: ‘The  Hud and its sisters have caused me to turn gray!’”", "ch": 5, "ch_en": "Appearing Of The White Hair Of Rasoolullah", "ch_ar": "باب ما جاء في شيب رسول الله صلى الله عليه وسلم"}, "shamail:119": {"ar": "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، قَالَ‏:‏ حَدَّثَنَا ابْنُ لَهِيعَةَ، عَنْ أَبِي يُونُسَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ‏:‏ وَلا رَأَيْتُ شَيْئًا أَحْسَنَ مِنْ رَسُولِ اللهِ صلى الله عليه وسلم كَأَنَّ الشَّمْسَ تَجْرِي فِي وَجْهِهِ، وَمَا رَأَيْتُ أَحَدًا أَسْرَعَ فِي مِشْيَتِهِ مِنْ رَسُولِ اللهِ صلى الله عليه وسلم كَأَنَّمَا الأَرْضُ تُطْوَى لَهُ إِنَّا لَنُجْهِدُ أَنْفُسَنَا وَإِنَّهُ لَغَيْرُ مُكْتَرِثٍ‏.‏", "narrator": "Abu Huraira said:", "en": "\"I have not seen anything more beautiful than Allah’s Messenger (Allah bless him and give him peace). The sun seemed to shine in his face. Nor have I seen anyone more rapid in his gait than Allah’s Messenger (Allah bless him and give him peace). The earth seemed to be folded up for him. We must strenuously exert ourselves, while he is not subject to any stress.\"", "ch": 18, "ch_en": "The Walking Of Rasoolullah", "ch_ar": "باب ما جاء في مشية رسول الله صلى الله عليه وسلم"}, "shamail:197": {"ar": "حَدَّثَنَا مُحَمَّدُ بْنُ حُمَيْدٍ الرَّازِيُّ، قَالَ‏:‏ حَدَّثَنَا إِبْرَاهِيمُ بْنُ الْمُخْتَارِ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، عَنْ أَبِي عُبَيْدَةَ بْنِ مُحَمَّدِ بْنِ عَمَّارِ بْنِ يَاسِرٍ، عَنِ الرُّبَيِّعِ بِنْتِ مُعَوِّذِ بْنِ عَفْرَاءَ، قَالَتْ‏:‏ بَعَثَنِي مُعَاذُ بْنُ عَفْرَاءَ بِقِنَاعٍ مِنْ رُطَبٍ وَعَلَيْهِ أَجْرٌ مِنْ قِثَّاءِ زُغْبٍ وَكَانَ النَّبِيُّ صلى الله عليه وسلم يُحِبُّ الْقِثَّاءَ، فَأَتَيْتُهُ بِهِ وَعِنْدَهُ حِلْيَةٌ قَدْ قَدِمَتْ عَلَيْهِ مِنَ الْبَحْرَيْنِ، فَمَلأَ يَدَهُ مِنْهَا فَأَعْطَانِيهِ‏.‏", "narrator": "Ar-Rubai bint Mu'awwidh ibn 'Afra’ said:", "en": "\"Mu'adh ibn 'Afra sent me with a tray of ripe dates, and on it there were pieces of fluffy cucumber. He  (Allah bless him and give him peace) used to love cucumbers, so I brought them to him. He had with him some ornaments that had come to him from Bahrain, so he took a handful of them and gave it to me.\"", "ch": 29, "ch_en": "The Fruits Eaten By Rasoolullah", "ch_ar": "باب ما جاء في صفة فاكهة رسول الله صلى الله عليه وسلم"}, "shamail:217": {"ar": "حَدَّثَنَا حُمَيْدُ بْنُ مَسْعَدَةَ الْبَصْرِيُّ، قَالَ‏:‏ حَدَّثَنَا حُمَيْدُ بْنُ الأَسْوَدِ، عَنِ أُسَامَةَ بْنِ زَيْدٍ، عَنِ الزُّهْرِيِّ، عَنْ عُرْوَةَ، عَنْ عَائِشَةَ، قَالَتْ‏:‏ مَا كَانَ رَسُولُ اللهِ صلى الله عليه وسلم يَسْرُدُ سرْدَكُمْ هَذَا، وَلَكِنَّهُ كَانَ يَتَكَلَّمُ بِكَلامٍ بَيِّنٍ فَصْلٍ، يَحْفَظُهُ مَنْ جَلَسَ إِلَيْهِ‏.‏", "narrator": "'A’isha said (may Allah the Exalted be well pleased with her):", "en": "\"Allah’s Messenger (Allah bless him and give him peace) would not speak on and on the way you do. Rather, he would pause periodically, so that those who sat with him would remember what he said.”", "ch": 33, "ch_en": "The Speech Of rasoolullah", "ch_ar": "باب كيف كان كلام رسول الله صلى الله عليه وسلم"}, "shamail:218": {"ar": "حَدَّثَنَا مُحَمَّدُ بْنُ يَحْيَى، قَالَ‏:‏ حَدَّثَنَا أَبُو قُتَيْبَةَ سَلْمُ بْنُ قُتَيْبَةَ، عَنْ عَبْدِ اللهِ بْنِ الْمُثَنَّى، عَنْ ثُمَامَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ‏:‏ كَانَ رَسُولُ اللهِ صلى الله عليه وسلم، يُعِيدُ الْكَلِمَةَ ثَلاثًا لِتُعْقَلَ عَنْهُ‏.‏", "narrator": "Anas ibn Malik said:", "en": "\"Allah’s Messenger (Allah bless him and give him peace) used to repeat each expression three times in order to make himself understood.”", "ch": 33, "ch_en": "The Speech Of rasoolullah", "ch_ar": "باب كيف كان كلام رسول الله صلى الله عليه وسلم"}, "shamail:219": {"ar": "حَدَّثَنَا سُفْيَانُ بْنُ وَكِيعٍ، قَالَ‏:‏ حَدَّثَنَا جُمَيْعُ بْنُ عُمَرَ بْنِ عَبْدِ الرَّحْمَنِ الْعِجْلِيُّ، قَالَ‏:‏ حدَّثنِي رَجُلٌ مِنْ بَنِي تَمِيمٍ مِنْ وَلَدِ أَبِي هَالَةَ زَوْجِ خَدِيجَةَ يُكْنَى أَبَا عَبْدِ اللهِ، عَنِ ابْنٍ لأَبِي هَالَةَ، عَنِ الْحَسَنِ بْنِ عَلِيٍّ، قَالَ‏:‏ سَأَلْتُ خَالِي هِنْدُ بْنُ أَبِي هَالَةَ، وَكَانَ وَصَّافًا، فَقُلْتُ‏:‏ صِفْ لِي مَنْطِقَ رَسُولِ اللهِ صلى الله عليه وسلم، قَالَ‏:‏ كَانَ رَسُولُ اللهِ صلى الله عليه وسلم مُتَوَاصِلَ الأَحْزَانِ، دَائِمَ الْفِكْرَةِ، لَيْسَتْ لَهُ رَاحَةٌ، طَوِيلُ السَّكْتِ، لا يَتَكَلَّمُ فِي غَيْرِ حَاجَةٍ، يَفْتَتِحُ الْكَلامَ، وَيَخْتِمُهُ بِاسْمِ اللهِ تَعَالَى، وَيَتَكَلَّمُ بِجَوَامِعِ الْكَلِمِ، كَلامُهُ فَصْلٌ، لا فُضُولَ، وَلا تَقْصِيرَ، لَيْسَ بِالْجَافِي، وَلا الْمُهِينِ، يُعَظِّمُ النِّعْمَةَ وَإِنْ دَقَّتْ لا يَذُمُّ مِنْهَا شَيْئًا، غَيْرَ أَنَّهُ لَمْ يَكُنْ يَذُمُّ ذَوَّاقًا وَلا يَمْدَحُهُ، وَلا تُغْضِبُهُ الدُّنْيَا، وَلا مَا كَانَ لَهَا، فَإِذَا تُعُدِّيَ الْحَقُّ، لَمْ يَقُمْ لِغَضَبِهِ شَيْءٌ، حَتَّى يَنْتَصِرَ لَهُ، وَلا يَغْضَبُ لِنَفْسِهِ، وَلا يَنْتَصِرُ لَهَا، إِذَا أَشَارَ بِكَفِّهِ كُلِّهَا، وَإِذَا تَعَجَّبَ قَلَبَهَا، وَإِذَا تَحَدَّثَ اتَّصَلَ بِهَا، وَضَرَبَ بِرَاحَتِهِ الْيُمْنَى بَطْنَ إِبْهَامِهِ الْيُسْرَى، وَإِذَا غَضِبَ أَعْرَضَ وَأَشَاحَ، وَإِذَا فَرِحَ غَضَّ طَرْفَهُ، جُلُّ ضَحِكِهِ التَّبَسُّمُ، يَفْتَرُّ عَنْ مِثْلِ حَبِّ الْغَمَامِ‏.‏", "narrator": "Al-Hasan ibn 'Ali said (may Allah the Exalted be well pleased with him and his father):", "en": "“I said to my maternal uncle, Hind ibn Abi Hala, who was skilled at describing people: ‘Describe for me the manner of speech Allah’s Messenger (Allah bless him and give him peace)!’ He said: Allah’s Messenger (Allah bless him and give him peace) was constantly sympathetic with sorrows, persistent in thought, having no repose, prolonged in silence. He would not speak unnecessarily. He would introduce and conclude his speech with: 'Bismillahi ta'ala . His speech was concise, neither excessive nor abridged. It was neither uncouth nor contemptible. He would extol a blessing, however small, and he would not find fault with any aspect of it. He neither condemned nor praised those who enjoyed food and drink, and he would not be angered by this world. If the truth were overstepped, he would be so furious that he could do nothing but right the wrong. He would not be angry for his own sake or come to his own defense. When he beckoned, he beckoned with the whole of the palm of his hand, and when he was astonished, he turned it over, and when he spoke, he gestured with his hands, and placed his right palm over the base of his left thumb. When he was angry, he turned away and averted his face, and when he was happy, he lowered his gaze. Most of his laughter was in the form of a smile that revealed teeth as white as hailstones'.”", "ch": 33, "ch_en": "The Speech Of rasoolullah", "ch_ar": "باب كيف كان كلام رسول الله صلى الله عليه وسلم"}, "shamail:221": {"ar": "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، قَالَ‏:‏ أَخْبَرَنَا ابْنُ لَهِيعَةَ، عَنْ عُبَيْدِ اللهِ بْنِ الْمُغِيرَةِ، عَنْ عَبْدِ اللهِ بْنِ الْحَارِثِ بْنِ جَزْءٍ، أَنَّهُ قَالَ‏:‏ مَا رَأَيْتُ أَحَدًا أَكْثَرَ تَبَسُّمًا مِنْ رَسُولِ اللهِ صلى الله عليه وسلم‏.‏‏.‏", "narrator": "‘Abdullah ibn al-Harith ibn Jaz said (may Allah be well pleased with him):", "en": "\"I have not seen anyone with a more cheerful countenance than Allah's Messenger (Allah bless him and give him peace)!\"", "ch": 34, "ch_en": "The Laughing Of Rasoolullah", "ch_ar": "باب ما جاء في ضحك رسول الله صلى الله عليه وسلم"}, "shamail:222": {"ar": "حَدَّثَنَا أَحْمَدُ بْنُ خَالِدٍ الْخَلالُ، قَالَ‏:‏ حَدَّثَنَا يَحْيَى بْنُ إِسْحَاقَ السَّيْلَحَانِيُّ، قَالَ‏:‏ حَدَّثَنَا لَيْثُ بْنُ سَعْدٍ، عَنْ يَزِيدَ بْنِ أَبِي حَبِيبٍ، عَنْ عَبْدِ اللهِ بْنِ الْحَارِثِ، قَالَ‏:‏ مَا كَانَ ضَحِكُ رَسُولِ اللهِ صلى الله عليه وسلم إِلا تَبَسُّمًا‏.‏‏.‏", "narrator": "Abdullah ibn al-Harith said (may Allah be well pleased with him):", "en": "“The laughter of Allah’s Messenger (Allah bless him and give him peace) was nothing but a joyful smile.”", "ch": 34, "ch_en": "The Laughing Of Rasoolullah", "ch_ar": "باب ما جاء في ضحك رسول الله صلى الله عليه وسلم"}, "shamail:225": {"ar": "حَدَّثَنَا أَحْمَدُ بْنُ مَنِيعٍ، قَالَ‏:‏ حَدَّثَنَا مُعَاوِيَةُ بْنُ عَمْرٍو، قَالَ‏:‏ حَدَّثَنَا زَائِدَةُ، عَنِ إِسْمَاعِيلَ بْنِ أَبِي خَالِدٍ، عَنْ قَيْسٍ، عَنْ جَرِيرٍ، قَالَ‏:‏ مَا حَجَبَنِي رَسُولُ اللهِ صلى الله عليه وسلم، وَلا رَآنِي مُنْذُ أَسْلَمْتُ إِلا تَبَسَّمَ‏.‏", "narrator": "", "en": "Same as the above hadith.", "ch": 34, "ch_en": "The Laughing Of Rasoolullah", "ch_ar": "باب ما جاء في ضحك رسول الله صلى الله عليه وسلم"}, "shamail:227": {"ar": "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، قَالَ‏:‏ حَدَّثَنَا أَبُو الأَحْوَصِ، عَنْ أَبِي إِسْحَاقَ، عَنْ عَلِيِّ بْنِ رَبِيعَةَ، قَالَ‏:‏ شَهِدْتُ عَلِيًّا، أُتِيَ بِدَابَّةٍ لِيَرْكَبَهَا فَلَمَّا وَضَعَ رِجْلَهُ فِي الرِّكَابِ، قَالَ‏:‏ بِسْمِ اللهِ، فَلَمَّا اسْتَوَى عَلَى ظَهْرِهَا، قَالَ‏:‏ الْحَمْدُ لِلَّهِ، ثُمَّ قَالَ‏:‏ سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ، ثُمَّ قَالَ‏:‏ الْحَمْدُ لِلَّهِ ثَلاثًا، وَاللَّهُ أَكْبَرُ ثَلاثًا، سُبْحَانَكَ إِنِّي ظَلَمْتُ نَفْسِي، فَاغْفِرْ لِي فَإِنَّهُ لا يَغْفِرُ الذُّنُوبَ إِلا أَنْتَ، ثُمَّ ضَحِكَ فَقُلْتُ‏:‏ مِنْ أَيِّ شَيْءٍ ضَحِكْتَ يَا أَمِيرَ الْمُؤْمِنِينَ‏؟‏ قَالَ‏:‏ رَأَيْتُ رَسُولَ اللهِ صلى الله عليه وسلم صَنَعَ كَمَا صَنَعْتُ ثُمَّ ضَحِكَ، فَقُلْتُ‏:‏ مِنْ أَيِّ شَيْءٍ ضَحِكْتَ يَا رَسُولَ اللهِ‏؟‏ قَالَ‏:‏ إِنَّ رَبَّكَ لَيَعْجَبُ مِنْ عَبْدِهِ، إِذَا قَالَ‏:‏ رَبِّ اغْفِرْ لِي ذُنُوبِي، إِنَّهُ لا يَغْفِرُ الذُّنُوبَ غَيْرُكَ‏.‏‏", "narrator": "'Ali ibn Rabi'a said:", "en": "\"I was present when 'Ali (may Allah be well pleased with him) had an animal brought for him to ride. When he placed his foot in the stirrup, he said: “In the Name of Allah . (Al-Qur'an;43:13-14)Then he said: “Praise be to Allah,” three times, and: “Allah is Supremely Great,” three times, then: “Glory be to You! I have wronged myself, so forgive me, for no one forgives sins but You!” Then he laughed, so I said to him: “What has made you laugh, O Commander of the Believers?” He said: “I saw Allah’s Messenger (Allah bless him and give him peace) do just as I did now, after which he laughed, so I said: \"What has made you laugh, O Messenger of Allah?\" He replied: ‘Your Lord surely marvels at His servant when he says: “My Lord, forgive me my sins,\nknowing that no one but He forgives sins'!”", "ch": 34, "ch_en": "The Laughing Of Rasoolullah", "ch_ar": "باب ما جاء في ضحك رسول الله صلى الله عليه وسلم"}, "shamail:252": {"ar": "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، وَبِشْرُ بْنُ مُعَاذٍ، قَالا‏:‏ حَدَّثَنَا أَبُو عَوَانَةَ، عَنْ زِيَادِ بْنِ عِلاقَةَ، عَنِ الْمُغِيرَةِ بْنِ شُعْبَةَ، قَالَ‏:‏ صَلَّى رَسُولُ اللهِ صلى الله عليه وسلم، حَتَّى انْتَفَخَتْ قَدَمَاهُ، فَقِيلَ لَهُ‏:‏ أَتَتَكَلَّفُ هَذَا، وَقَدْ غَفَرَ اللَّهُ لَكَ مَا تَقَدَّمَ مِنْ ذَنْبِكَ وَمَا تَأَخَّرَ‏؟‏ قَالَ‏:‏ أَفَلا أَكُونُ عَبْدًا شَكُورًا‏.‏", "narrator": "Al-Mughira ibn Shu'ba said (may Allah be well pleased with him):", "en": "\"Allah’s Messenger (Allah bless him and give him peace) performed the ritual prayer until his feet became swollen, so he was asked: 'Must you burden yourself with this, when\nAllah has already forgiven you your former and your latter sins?' He replied: 'Shall I not be a thankful servant?'”", "ch": 40, "ch_en": "Worship And Devotion Of Rasoolullah", "ch_ar": "باب ما جاء في عبادة النبي صلى الله عليه وسلم"}, "shamail:302": {"ar": "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، قَالَ‏:‏ حَدَّثَنَا اللَّيْثُ، عَنِ ابْنِ أَبِي مُلَيْكَةَ، عَنْ يَعَلَى بْنِ مَمْلَكٍ، أَنَّهُ سَأَلَ أُمَّ سَلَمَةَ، عَنْ قِرَاءَةِ رَسُولِ اللهِ صلى الله عليه وسلم، فَإِذَا هِيَ تَنْعَتُ قِرَاءَةً مُفَسَّرَةً حَرْفًا حَرْفًا‏.‏", "narrator": "Ibn Abi Mulaika reported:", "en": "Ya'la ibn Mamlak asked Umm Salama about the Qur’anic recitation of Allah’s Messenger (Allah bless him and give him peace), whereupon she described a Qur’anic recitation that was explained letter by letter.", "ch": 44, "ch_en": "The Recital Of Sayyidina Rasoolullah", "ch_ar": "باب ماجاء في قراءة رسول الله صلى الله عليه وسلم"}, "shamail:303": {"ar": "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، قَالَ‏:‏ حَدَّثَنَا وَهْبُ بْنُ جَرِيرِ بْنِ حَازِمٍ، قَالَ‏:‏ حَدَّثَنَا أَبِي، عَنْ قَتَادَةَ، قَالَ‏:‏ قُلْتُ لأَنَسِ بْنِ مَالِكٍ‏:‏ كَيْفَ كَانَتْ قِرَاءَةُ رَسُولِ اللهِ صلى الله عليه وسلم‏؟‏ فَقَالَ‏:‏ مَدًّا‏.‏", "narrator": "Qatada said:", "en": "“I said to Anas ibn Malik: 'How was the Qur’anic recitation of Alla’s Messenger (Allah bless him and give him peace)?’ He said: ‘With the voice drawn out over the long vowels.'”", "ch": 44, "ch_en": "The Recital Of Sayyidina Rasoolullah", "ch_ar": "باب ماجاء في قراءة رسول الله صلى الله عليه وسلم"}, "shamail:304": {"ar": "حَدَّثَنَا عَلِيُّ بْنُ حُجْرٍ، قَالَ‏:‏ حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ الأُمَوِيُّ، عَنِ ابْنِ جُرَيْجٍ، عَنِ ابْنِ أَبِي مُلَيْكَةَ، عَنْ أُمِّ سَلَمَةَ، قَالَتْ‏:‏ كَانَ النَّبِيُّ صلى الله عليه وسلم، يَقْطَعُ قِرَاءَتَهُ، يَقُولُ‏:‏ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ثُمَّ يَقِفُ، ثُمَّ يَقُولُ‏:‏ الرَّحْمَنِ الرَّحِيمِ ثُمَّ يَقِفُ، وَكَانَ يَقْرَأُ مَلِكِ يَوْمِ الدِّينِ‏.‏", "narrator": "Umm Salama said:", "en": "\"The Prophet (Allah bless him and give him peace) used to interrupt his Qur’anic recitation. He would say: “Praise be to Allah, the Lord of all the worlds .”", "ch": 44, "ch_en": "The Recital Of Sayyidina Rasoolullah", "ch_ar": "باب ماجاء في قراءة رسول الله صلى الله عليه وسلم"}, "shamail:306": {"ar": "حَدَّثَنَا مَحْمُودُ بْنُ غَيْلانَ، قَالَ‏:‏ حَدَّثَنَا وَكِيعٌ، قَالَ‏:‏ حَدَّثَنَا مِسْعَرٌ، عَنْ أَبِي الْعَلاءِ الْعَبْدِيِّ، عَنْ يَحْيَى بْنِ جَعْدَةَ، عَنْ أُمِّ هَانِئٍ، قَالَتْ‏:‏ كُنْتُ أَسْمَعُ قِرَاءَةَ النَّبِيِّ صلى الله عليه وسلم، بِاللَّيْلِ وَأَنَا عَلَى عَرِيشِي‏.‏", "narrator": "Umm Hani' said:", "en": "“I used to hear the Qur’anic recitation of the Prophet (Allah bless him and give him peace) during the night while I was on my pallet.”", "ch": 44, "ch_en": "The Recital Of Sayyidina Rasoolullah", "ch_ar": "باب ماجاء في قراءة رسول الله صلى الله عليه وسلم"}, "shamail:308": {"ar": "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، قَالَ‏:‏ حَدَّثَنَا نُوحُ بْنُ قَيْسٍ الْحُدَّانِيُّ، عَنْ حُسَامِ بْنِ مِصَكٍّ، عَنْ قَتَادَةَ، قَالَ‏:‏ مَا بَعَثَ اللَّهُ نَبِيًّا إِلا حَسَنَ الْوَجْهِ، حَسَنَ الصَّوْتِ، وَكَانَ نَبِيُّكُمْ صلى الله عليه وسلم حَسَنَ الْوَجْهِ، حَسَنَ الصَّوْتِ، وَكَانَ لا يُرَجِّعُ‏.‏", "narrator": "Qataadah said:", "en": "\"Allah has not sent a Prophet unless he was endowed with a handsome face and a beautiful voice, and your Prophet (Allah bless him and give him peace) was endowed with a handsome face and a beautiful voice, and he did not chant in a quavering tone.”", "ch": 44, "ch_en": "The Recital Of Sayyidina Rasoolullah", "ch_ar": "باب ماجاء في قراءة رسول الله صلى الله عليه وسلم"}, "shamail:310": {"ar": "حَدَّثَنَا سُوَيْدُ بْنُ نَصْرٍ، قَالَ‏:‏ حَدَّثَنَا عَبْدُ اللهِ بْنُ الْمُبَارِكِ، عَنْ حَمَّادِ بْنِ سَلَمَةَ، عَنْ ثَابِتٍ، عَنْ مُطَرِّفٍ وَهُوَ ابْنُ عَبْدِ اللهِ بْنِ الشِّخِّيرِ، عَنْ أَبِيهِ، قَالَ‏:‏ أَتَيْتُ رَسُولَ اللهِ صلى الله عليه وسلم وَهُوَ يُصَلِّي، وَلِجَوْفِهِ أَزِيزٌ كَأَزِيزِ الْمِرْجَلِ مِنَ الْبُكَاءِ‏.‏", "narrator": "'Abdullah ibn ash-Shikh-khir reported that his father said:", "en": "\"I came to Allah’s Messenger (Allah bless him and give him peace) while he was performing the ritual prayer, and his inner body  was producing a humming sound like the humming of the cauldron due to his weeping.”", "ch": 45, "ch_en": "The Weeping Of Sayyidina Rasoolullah", "ch_ar": "باب ماجاء في بكاء رسول الله صلى الله عليه وسلم"}, "shamail:311": {"ar": "حَدَّثَنَا مَحْمُودُ بْنُ غَيْلانَ، قَالَ‏:‏ حَدَّثَنَا مُعَاوِيَةُ بْنُ هِشَامٍ، قَالَ‏:‏ حَدَّثَنَا سُفْيَانُ، عَنِ الأَعْمَشِ، عَنِ إِبْرَاهِيمَ، عَنْ عُبَيْدَةَ، عَنْ عَبْدِ اللهِ بْنِ مَسْعُودٍ، قَالَ‏:‏ قَالَ لِي رَسُولُ اللهِ صلى الله عليه وسلم‏:‏ اقْرَأْ عَلَيَّ فَقُلْتُ‏:‏ يَا رَسُولَ اللهِ، أَقَرَأُ عَلَيْكَ وَعَلَيْكَ أُنْزِلَ، قَالَ‏:‏ إِنِّي أُحِبُّ أَنْ أَسْمَعَهُ مِنْ غَيْرِي، فَقَرَأْتُ سُورَةَ النِّسَاءِ، حَتَّى بَلَغْتُ وَجِئِنَا بِكَ عَلَى هَؤُلاءِ شَهِيدًا، قَالَ‏:‏ فَرَأَيْتُ عَيْنَيْ رَسُولِ اللهِ تَهْمِلانِ‏.‏", "narrator": "'Abdu’llah ibn Mas'ud said (may Allah be well pleased with him):", "en": "“Allah’s Messenger (Allah bless him and give him peace) told me: ‘Recite the Qur’an to me,’ so I said: ‘O Messenger of Allah, shall I recite the Qur’an to you when it was to you that it was revealed?’ He said: ‘I like to hear it from someone other than myself,’ so I recited the Sura of the Women ' (Al-Qur'an; 4:41). Then I saw the eyes of Allah’s Messenger bathed in tears.”", "ch": 45, "ch_en": "The Weeping Of Sayyidina Rasoolullah", "ch_ar": "باب ماجاء في بكاء رسول الله صلى الله عليه وسلم"}, "shamail:313": {"ar": "حَدَّثَنَا مَحْمُودُ بْنُ غَيْلانَ، قَالَ‏:‏ حَدَّثَنَا أَبُو أَحْمَدَ، قَالَ‏:‏ حَدَّثَنَا سُفْيَانُ، عَنْ عَطَاءِ بْنِ السَّائِبِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ‏:‏ أَخَذَ رَسُولُ اللهِ صلى الله عليه وسلم ابْنَةً لَهُ تَقْضِي فَاحْتَضَنَهَا فَوَضَعَهَا بَيْنَ يَدَيْهِ، فَمَاتَتْ وَهِيَ بَيْنَ يَدَيْهِ وَصَاحَتْ أُمُّ أَيْمَنَ، فَقَالَ يَعْنِي صلى الله عليه وسلم‏:‏ أَتَبْكِينَ عِنْدَ رَسُولِ اللهِ‏؟‏ فَقَالَتْ‏:‏ أَلَسْتُ أَرَاكَ تَبْكِي‏؟‏ قَالَ‏:‏ إِنِّي لَسْتُ أَبْكِي، إِنَّمَا هِيَ رَحْمَةٌ، إِنَّ الْمُؤْمِنَ بِكُلِّ خَيْرٍ عَلَى كُلِّ حَالٍ، إِنَّ نَفْسَهُ تُنْزَعُ مِنْ بَيْنِ جَنْبَيْهِ، وَهُوَ يَحْمَدُ اللَّهَ تعالى ‏.‏", "narrator": "Ibn Abbas said:", "en": "“Allah’s Messenger (Allah bless him and give him peace) took hold of a daughter of his who was dying, then embraced her and she died in his arms. Umm Aiman cried, so he, meaning the Prophet (Allah bless him and give him peace), said: 'Are you weeping in the presence of Allah’s Messenger?’ She replied: 'Am I not seeing you weep?’ He said: 'I am not weeping. It is actually a mercy. The believer has every benefit in every situation. His soul is removed within him as he praises Allah (Almighty and Glorious is He)!'”", "ch": 45, "ch_en": "The Weeping Of Sayyidina Rasoolullah", "ch_ar": "باب ماجاء في بكاء رسول الله صلى الله عليه وسلم"}, "shamail:333": {"ar": "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، قَالَ‏:‏ حَدَّثَنَا جَعْفَرُ بْنُ سُلَيْمَانَ الضُّبَعِيُّ، عَنْ ثَابِتٍ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ‏:‏ خَدَمْتُ رَسُولَ اللهِ صلى الله عليه وسلم عَشْرَ سِنِينَ، فَمَا قَالَ لِي أُفٍّ قَطُّ، وَمَا قَالَ لِشَيْءٍ صَنَعْتُهُ، لِمَ صَنَعْتَهُ، وَلا لِشَيْءٍ تَرَكْتُهُ، لِمَ تَرَكْتَهُ‏؟‏ وَكَانَ رَسُولُ اللهِ صلى الله عليه وسلم، مِنْ أَحْسَنِ النَّاسِ خُلُقًا، وَلا مَسَسْتُ خَزًّا وَلا حَرِيرًا، وَلا شَيْئًا كَانَ أَلْيَنَ مِنْ كَفِّ رَسُولِ اللهِ صلى الله عليه وسلم، وَلا شَمَمْتُ مِسْكًا قَطُّ، وَلا عِطْرًا كَانَ أَطْيَبَ مِنْ عَرَقِ رسول الله صلى الله عليه وسلم‏.‏", "narrator": "Anas ibn Maik said (may Allah be well pleased with him):", "en": "\"I served Allah’s Messenger (Allah bless him and give him peace) for ten years, and he never said “Uff!” to me. He never asked me about something I had done, saying: “Why did you do it?” nor about something I had left undone, saying: “Why did you leave it undone?” Allah’s Messenger (Allah bless him and give him peace) was the finest of human beings in character. I never felt any silk, or anything at all. that was softer than the palm of the hand of Allah’s Messenger (Allah bless him and give him peace). I never smelled any musk, nor any perfume, more fragrant than the sweat of the Prophet (Allah bless him and give him peace)!”", "ch": 48, "ch_en": "Noble Character And Habits Of Sayyidina Rasoolullah", "ch_ar": "باب ماجاء في خلق رسول الله صلى الله عليه وسلم"}, "shamail:336": {"ar": "حَدَّثَنَا هَارُونُ بْنُ إِسْحَاقَ الْهَمْدَانِيُّ، قَالَ‏:‏ حَدَّثَنَا عَبْدَةُ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ‏:‏ مَا ضَرَبَ رَسُولُ اللهِ صلى الله عليه وسلم، بِيَدِهِ شَيْئًا قَطُّ، إِلا أَنْ يُجَاهِدَ فِي سَبِيلِ اللهِ، وَلا ضَرَبَ خَادِمًا َوِلا امْرَأَةً‏.‏", "narrator": "'A’isha said (may Allah be well pleased with her):", "en": "\"Allah’s Messenger (Allah bless him and give him peace) never struck anything with his hand unless he was struggling in the cause of Allah , nor did he ever strike a servant or a woman.”", "ch": 48, "ch_en": "Noble Character And Habits Of Sayyidina Rasoolullah", "ch_ar": "باب ماجاء في خلق رسول الله صلى الله عليه وسلم"}, "shamail:346": {"ar": "حَدَّثَنَا مَحْمُودُ بْنُ غَيْلانَ، قَالَ‏:‏ حَدَّثَنَا أَبُو دَاوُدَ، قَالَ‏:‏ حَدَّثَنَا شُعْبَةُ، عَنْ قَتَادَةَ، قَالَ‏:‏ سَمِعْتُ عَبْدَ اللهِ بْنَ أَبِي عُتْبَةَ، يُحَدِّثُ عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ، قَالَ‏:‏ كَانَ النَّبِيُّ صلى الله عليه وسلم أَشدَّ حَيَاءً مِنَ الْعَذرَاءِ فِي خِدْرِهَا، وَكَانَ إِذَا كَرِهَ شَيْئًا عَرَفْنَاهُ فِي وَجْهِهِ‏.‏", "narrator": "Abu Sa'id al-Khudri said:", "en": "\"He (Allah bless him and give him peace) was more bashful than the virgin in her boudoir, and when he disapproved of something, we knew it from the expression on his face.”", "ch": 49, "ch_en": "Modesty Of Sayyidina Rasoolullah", "ch_ar": "باب ماجاء في حياء رسول الله صلى الله عليه وسلم"}, "bukhari:2": {"ar": "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، قَالَ أَخْبَرَنَا مَالِكٌ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ أُمِّ الْمُؤْمِنِينَ ـ رضى الله عنها ـ أَنَّ الْحَارِثَ بْنَ هِشَامٍ ـ رضى الله عنه ـ سَأَلَ رَسُولَ اللَّهِ صلى الله عليه وسلم فَقَالَ يَا رَسُولَ اللَّهِ كَيْفَ يَأْتِيكَ الْوَحْىُ فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\n\"‏ أَحْيَانًا يَأْتِينِي مِثْلَ صَلْصَلَةِ الْجَرَسِ ـ وَهُوَ أَشَدُّهُ عَلَىَّ ـ فَيُفْصَمُ عَنِّي وَقَدْ وَعَيْتُ عَنْهُ مَا قَالَ، وَأَحْيَانًا يَتَمَثَّلُ لِيَ الْمَلَكُ رَجُلاً فَيُكَلِّمُنِي فَأَعِي مَا يَقُولُ ‏\"‏‏.‏ قَالَتْ عَائِشَةُ رضى الله عنها وَلَقَدْ رَأَيْتُهُ يَنْزِلُ عَلَيْهِ الْوَحْىُ فِي الْيَوْمِ الشَّدِيدِ الْبَرْدِ، فَيَفْصِمُ عَنْهُ وَإِنَّ جَبِينَهُ لَيَتَفَصَّدُ عَرَقًا‏.‏", "narrator": "Narrated 'Aisha:", "en": "(the mother of the faithful believers) Al-Harith bin Hisham asked Allah's Messenger (ﷺ) \"O Allah's Messenger (ﷺ)! How is the Divine Inspiration revealed to you?\" Allah's Messenger (ﷺ) replied, \"Sometimes it is (revealed) like the ringing of a bell, this form of Inspiration is the hardest of all and then this state passes off after I have grasped what is inspired. Sometimes the Angel comes in the form of a man and talks to me and I grasp whatever he says.\" 'Aisha added: Verily I saw the Prophet (ﷺ) being inspired divinely on a very cold day and noticed the sweat dropping from his forehead (as the Inspiration was over).", "ch": 1, "ch_en": "Revelation", "ch_ar": "كتاب بدء الوحى"}, "bukhari:169": {"ar": "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، قَالَ أَخْبَرَنَا مَالِكٌ، عَنْ إِسْحَاقَ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي طَلْحَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، أَنَّهُ قَالَ رَأَيْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم وَحَانَتْ صَلاَةُ الْعَصْرِ، فَالْتَمَسَ النَّاسُ الْوَضُوءَ فَلَمْ يَجِدُوهُ، فَأُتِيَ رَسُولُ اللَّهِ صلى الله عليه وسلم بِوَضُوءٍ، فَوَضَعَ رَسُولُ اللَّهِ صلى الله عليه وسلم فِي ذَلِكَ الإِنَاءِ يَدَهُ، وَأَمَرَ النَّاسَ أَنْ يَتَوَضَّئُوا مِنْهُ‏.‏ قَالَ فَرَأَيْتُ الْمَاءَ يَنْبُعُ مِنْ تَحْتِ أَصَابِعِهِ حَتَّى تَوَضَّئُوا مِنْ عِنْدِ آخِرِهِمْ‏.‏", "narrator": "Narrated Anas bin Malik:", "en": "saw Allah's Messenger (ﷺ) when the `Asr prayer was due and the people searched for water to perform \nablution but they could not find it. Later on (a pot full of) water for ablution was brought to Allah's \nApostle . He put his hand in that pot and ordered the people to perform ablution from it. I saw the \nwater springing out from underneath his fingers till all of them performed the ablution (it was one of \nthe miracles of the Prophet).", "ch": 4, "ch_en": "Ablutions (Wudu')", "ch_ar": "كتاب الوضوء"}, "bukhari:345": {"ar": "حَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، قَالَ حَدَّثَنَا اللَّيْثُ، عَنْ يُونُسَ، عَنِ ابْنِ شِهَابٍ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ كَانَ أَبُو ذَرٍّ يُحَدِّثُ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏\"‏ فُرِجَ عَنْ سَقْفِ بَيْتِي وَأَنَا بِمَكَّةَ، فَنَزَلَ جِبْرِيلُ فَفَرَجَ صَدْرِي، ثُمَّ غَسَلَهُ بِمَاءِ زَمْزَمَ، ثُمَّ جَاءَ بِطَسْتٍ مِنْ ذَهَبٍ مُمْتَلِئٍ حِكْمَةً وَإِيمَانًا، فَأَفْرَغَهُ فِي صَدْرِي ثُمَّ أَطْبَقَهُ، ثُمَّ أَخَذَ بِيَدِي فَعَرَجَ بِي إِلَى السَّمَاءِ الدُّنْيَا، فَلَمَّا جِئْتُ إِلَى السَّمَاءِ الدُّنْيَا قَالَ جِبْرِيلُ لِخَازِنِ السَّمَاءِ افْتَحْ‏.‏ قَالَ مَنْ هَذَا قَالَ هَذَا جِبْرِيلُ‏.‏ قَالَ هَلْ مَعَكَ أَحَدٌ قَالَ نَعَمْ مَعِي مُحَمَّدٌ صلى الله عليه وسلم‏.‏ فَقَالَ أُرْسِلَ إِلَيْهِ قَالَ نَعَمْ‏.‏ فَلَمَّا فَتَحَ عَلَوْنَا السَّمَاءَ الدُّنْيَا، فَإِذَا رَجُلٌ قَاعِدٌ عَلَى يَمِينِهِ أَسْوِدَةٌ وَعَلَى يَسَارِهِ أَسْوِدَةٌ، إِذَا نَظَرَ قِبَلَ يَمِينِهِ ضَحِكَ، وَإِذَا نَظَرَ قِبَلَ يَسَارِهِ بَكَى، فَقَالَ مَرْحَبًا بِالنَّبِيِّ الصَّالِحِ وَالاِبْنِ الصَّالِحِ‏.‏ قُلْتُ لِجِبْرِيلَ مَنْ هَذَا قَالَ هَذَا آدَمُ‏.‏ وَهَذِهِ الأَسْوِدَةُ عَنْ يَمِينِهِ وَشِمَالِهِ نَسَمُ بَنِيهِ، فَأَهْلُ الْيَمِينِ مِنْهُمْ أَهْلُ الْجَنَّةِ، وَالأَسْوِدَةُ الَّتِي عَنْ شِمَالِهِ أَهْلُ النَّارِ، فَإِذَا نَظَرَ عَنْ يَمِينِهِ ضَحِكَ، وَإِذَا نَظَرَ قِبَلَ شِمَالِهِ بَكَى، حَتَّى عَرَجَ بِي إِلَى السَّمَاءِ الثَّانِيَةِ فَقَالَ لِخَازِنِهَا افْتَحْ‏.‏ فَقَالَ لَهُ خَازِنُهَا مِثْلَ مَا قَالَ الأَوَّلُ فَفَتَحَ ‏\"‏‏.‏ قَالَ أَنَسٌ فَذَكَرَ أَنَّهُ وَجَدَ فِي السَّمَوَاتِ آدَمَ وَإِدْرِيسَ وَمُوسَى وَعِيسَى وَإِبْرَاهِيمَ ـ صَلَوَاتُ اللَّهِ عَلَيْهِمْ ـ وَلَمْ يُثْبِتْ كَيْفَ مَنَازِلُهُمْ، غَيْرَ أَنَّهُ ذَكَرَ أَنَّهُ وَجَدَ آدَمَ فِي السَّمَاءِ الدُّنْيَا، وَإِبْرَاهِيمَ فِي السَّمَاءِ السَّادِسَةِ‏.‏ قَالَ أَنَسٌ فَلَمَّا مَرَّ جِبْرِيلُ بِالنَّبِيِّ صلى الله عليه وسلم بِإِدْرِيسَ قَالَ مَرْحَبًا بِالنَّبِيِّ الصَّالِحِ وَالأَخِ الصَّالِحِ‏.‏ فَقُلْتُ مَنْ هَذَا قَالَ هَذَا إِدْرِيسُ‏.‏ ثُمَّ مَرَرْتُ بِمُوسَى فَقَالَ مَرْحَبًا بِالنَّبِيِّ الصَّالِحِ وَالأَخِ الصَّالِحِ‏.‏ قُلْتُ مَنْ هَذَا قَالَ هَذَا مُوسَى‏.‏ ثُمَّ مَرَرْتُ بِعِيسَى فَقَالَ مَرْحَبًا بِالأَخِ الصَّالِحِ وَالنَّبِيِّ الصَّالِحِ‏.‏ قُلْتُ مَنْ هَذَا قَالَ هَذَا عِيسَى‏.‏ ثُمَّ مَرَرْتُ بِإِبْرَاهِيمَ فَقَالَ مَرْحَبًا بِالنَّبِيِّ الصَّالِحِ وَالاِبْنِ الصَّالِحِ‏.‏ قُلْتُ مَنْ هَذَا قَالَ هَذَا إِبْرَاهِيمُ صلى الله عليه وسلم ‏\"‏‏.‏ قَالَ ابْنُ شِهَابٍ فَأَخْبَرَنِي ابْنُ حَزْمٍ أَنَّ ابْنَ عَبَّاسٍ وَأَبَا حَبَّةَ الأَنْصَارِيَّ كَانَا يَقُولاَنِ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏\"‏ ثُمَّ عُرِجَ بِي حَتَّى ظَهَرْتُ لِمُسْتَوًى أَسْمَعُ فِيهِ صَرِيفَ الأَقْلاَمِ ‏\"‏‏.‏ قَالَ ابْنُ حَزْمٍ وَأَنَسُ بْنُ مَالِكٍ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏\"‏ فَفَرَضَ اللَّهُ عَلَى أُمَّتِي خَمْسِينَ صَلاَةً، فَرَجَعْتُ بِذَلِكَ حَتَّى مَرَرْتُ عَلَى مُوسَى فَقَالَ مَا فَرَضَ اللَّهُ لَكَ عَلَى أُمَّتِكَ قُلْتُ فَرَضَ خَمْسِينَ صَلاَةً‏.‏ قَالَ فَارْجِعْ إِلَى رَبِّكَ، فَإِنَّ أُمَّتَكَ لاَ تُطِيقُ ذَلِكَ‏.‏ فَرَاجَعْتُ فَوَضَعَ شَطْرَهَا، فَرَجَعْتُ إِلَى مُوسَى قُلْتُ وَضَعَ شَطْرَهَا‏.‏ فَقَالَ رَاجِعْ رَبَّكَ، فَإِنَّ أُمَّتَكَ لاَ تُطِيقُ، فَرَاجَعْتُ فَوَضَعَ شَطْرَهَا، فَرَجَعْتُ إِلَيْهِ فَقَالَ ارْجِعْ إِلَى رَبِّكَ، فَإِنَّ أُمَّتَكَ لاَ تُطِيقُ ذَلِكَ، فَرَاجَعْتُهُ‏.‏ فَقَالَ هِيَ خَمْسٌ وَهْىَ خَمْسُونَ، لاَ يُبَدَّلُ الْقَوْلُ لَدَىَّ‏.‏ فَرَجَعْتُ إِلَى مُوسَى فَقَالَ رَاجِعْ رَبَّكَ‏.‏ فَقُلْتُ اسْتَحْيَيْتُ مِنْ رَبِّي‏.‏ ثُمَّ انْطَلَقَ بِي حَتَّى انْتَهَى بِي إِلَى سِدْرَةِ الْمُنْتَهَى، وَغَشِيَهَا أَلْوَانٌ لاَ أَدْرِي مَا هِيَ، ثُمَّ أُدْخِلْتُ الْجَنَّةَ، فَإِذَا فِيهَا حَبَايِلُ اللُّؤْلُؤِ، وَإِذَا تُرَابُهَا الْمِسْكُ ‏\"‏‏.‏", "narrator": "Narrated Abu Dhar:", "en": "Allah's Messenger (ﷺ) said, \"While I was at Mecca the roof of my house was opened and Gabriel descended, \nopened my chest, and washed it with Zamzam water. Then he brought a golden tray full of wisdom \nand faith and having poured its contents into my chest, he closed it. Then he took my hand and \nascended with me to the nearest heaven, when I reached the nearest heaven, Gabriel said to the \ngatekeeper of the heaven, 'Open (the gate).' The gatekeeper asked, 'Who is it?' Gabriel answered: \n'Gabriel.' He asked, 'Is there anyone with you?' Gabriel replied, 'Yes, Muhammad I is with me.' He \nasked, 'Has he been called?' Gabriel said, 'Yes.' So the gate was opened and we went over the nearest \nheaven and there we saw a man sitting with some people on his right and some on his left. When he \nlooked towards his right, he laughed and when he looked toward his left he wept. Then he said, \n'Welcome! O pious Prophet and pious son.' I asked Gabriel, 'Who is he?' He replied, 'He is Adam and \nthe people on his right and left are the souls of his offspring. Those on his right are the people of \nParadise and those on his left are the people of Hell and when he looks towards his right he laughs and \nwhen he looks towards his left he weeps.' \nThen he ascended with me till he reached the second heaven and he (Gabriel) said to its gatekeeper, \n'Open (the gate).' The gatekeeper said to him the same as the gatekeeper of the first heaven had said \nand he opened the gate. Anas said: \"Abu Dhar added that the Prophet (ﷺ) met Adam, Idris, Moses, Jesus \nand Abraham, he (Abu Dhar) did not mention on which heaven they were but he mentioned that he \n(the Prophet (ﷺ) ) met Adam on the nearest heaven and Abraham on the sixth heaven. Anas said, \"When \nGabriel along with the Prophet (ﷺ) passed by Idris, the latter said, 'Welcome! O pious Prophet and pious \nbrother.' The Prophet (ﷺ) asked, 'Who is he?' Gabriel replied, 'He is Idris.\" The Prophet (ﷺ) added, \"I passed \nby Moses and he said, 'Welcome! O pious Prophet and pious brother.' I asked Gabriel, 'Who is he?' \nGabriel replied, 'He is Moses.' Then I passed by Jesus and he said, 'Welcome! O pious brother and \npious Prophet.' I asked, 'Who is he?' Gabriel replied, 'He is Jesus. \nThen I passed by Abraham and he said, 'Welcome! O pious Prophet and pious son.' I asked Gabriel, \n'Who is he?' Gabriel replied, 'He is Abraham. The Prophet (ﷺ) added, 'Then Gabriel ascended with me to a \nplace where I heard the creaking of the pens.\" Ibn Hazm and Anas bin Malik said: The Prophet (ﷺ) said, \n\"Then Allah enjoined fifty prayers on my followers when I returned with this order of Allah, I passed \nby Moses who asked me, 'What has Allah enjoined on your followers?' I replied, 'He has enjoined \nfifty prayers on them.' Moses said, 'Go back to your Lord (and appeal for reduction) for your followers \nwill not be able to bear it.' (So I went back to Allah and requested for reduction) and He reduced it to \nhalf. When I passed by Moses again and informed him about it, he said, 'Go back to your Lord as your \nfollowers will not be able to bear it.' So I returned to Allah and requested for further reduction and \nhalf of it was reduced. I again passed by Moses and he said to me: 'Return to your Lord, for your \nfollowers will not be able to bear it. So I returned to Allah and He said, 'These are five prayers and \nthey are all (equal to) fifty (in reward) for My Word does not change.' I returned to Moses and he told \nme to go back once again. I replied, 'Now I feel shy of asking my Lord again.' Then Gabriel took me \ntill we '' reached Sidrat-il-Muntaha (Lote tree of; the utmost boundary) which was shrouded in colors, \nindescribable. Then I was admitted into Paradise where I found small (tents or) walls (made) of pearls \nand its earth was of musk.\"", "ch": 8, "ch_en": "Prayers (Salat)", "ch_ar": "كتاب الصلاة"}, "bukhari:701": {"ar": "حَدَّثَنَا أَبُو مَعْمَرٍ، قَالَ حَدَّثَنَا عَبْدُ الْوَارِثِ، عَنْ عَبْدِ الْعَزِيزِ، عَنْ أَنَسٍ، أَنَّ النَّبِيَّ صلى الله عليه وسلم قَالَ ‏\n\"‏ أَقِيمُوا الصُّفُوفَ فَإِنِّي أَرَاكُمْ خَلْفَ ظَهْرِي ‏\"‏‏.‏", "narrator": "Narrated Anas:", "en": "The Prophet (ﷺ) said, \"Straighten your rows, for I see you from behind my back.'", "ch": 10, "ch_en": "Call to Prayers (Adhaan)", "ch_ar": "كتاب الأذان"}, "bukhari:896": {"ar": "حَدَّثَنَا سَعِيدُ بْنُ أَبِي مَرْيَمَ، قَالَ حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، قَالَ أَخْبَرَنِي يَحْيَى بْنُ سَعِيدٍ، قَالَ أَخْبَرَنِي ابْنُ أَنَسٍ، أَنَّهُ سَمِعَ جَابِرَ بْنَ عَبْدِ اللَّهِ، قَالَ كَانَ جِذْعٌ يَقُومُ إِلَيْهِ النَّبِيُّ صلى الله عليه وسلم فَلَمَّا وُضِعَ لَهُ الْمِنْبَرُ سَمِعْنَا لِلْجِذْعِ مِثْلَ أَصْوَاتِ الْعِشَارِ حَتَّى نَزَلَ النَّبِيُّ صلى الله عليه وسلم فَوَضَعَ يَدَهُ عَلَيْهِ‏.‏ قَالَ سُلَيْمَانُ عَنْ يَحْيَى أَخْبَرَنِي حَفْصُ بْنُ عُبَيْدِ اللَّهِ بْنِ أَنَسٍ أَنَّهُ سَمِعَ جَابِرًا‏.‏", "narrator": "Narrated Jabir bin `Abdullah:", "en": "The Prophet (ﷺ) used to stand by a stem of a date-palm tree (while delivering a sermon). When the pulpit \nwas placed for him we heard that stem crying like a pregnant she-camel till the Prophet (ﷺ) got down from \nthe pulpit and placed his hand over it.", "ch": 11, "ch_en": "Friday Prayer", "ch_ar": "كتاب الجمعة"}, "bukhari:1115": {"ar": "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، قَالَ أَخْبَرَنَا مَالِكٌ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ الْمَقْبُرِيِّ، عَنْ أَبِي سَلَمَةَ بْنِ عَبْدِ الرَّحْمَنِ، أَنَّهُ أَخْبَرَهُ أَنَّهُ، سَأَلَ عَائِشَةَ ـ رضى الله عنها ـ كَيْفَ كَانَتْ صَلاَةُ رَسُولِ اللَّهِ صلى الله عليه وسلم فِي رَمَضَانَ فَقَالَتْ مَا كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يَزِيدُ فِي رَمَضَانَ وَلاَ فِي غَيْرِهِ عَلَى إِحْدَى عَشْرَةَ رَكْعَةً، يُصَلِّي أَرْبَعًا فَلاَ تَسَلْ عَنْ حُسْنِهِنَّ وَطُولِهِنَّ، ثُمَّ يُصَلِّي أَرْبَعًا فَلاَ تَسَلْ عَنْ حُسْنِهِنَّ وَطُولِهِنَّ، ثُمَّ يُصَلِّي ثَلاَثًا، قَالَتْ عَائِشَةُ فَقُلْتُ يَا رَسُولَ اللَّهِ أَتَنَامُ قَبْلَ أَنْ تُوتِرَ‏.‏ فَقَالَ ‏\n\"‏ يَا عَائِشَةُ، إِنَّ عَيْنَىَّ تَنَامَانِ وَلاَ يَنَامُ قَلْبِي ‏\"‏‏.‏", "narrator": "Narrated Abu Salma bin `Abdur Rahman:", "en": "I asked `Aisha, \"How is the prayer of Allah's Messenger (ﷺ) during the month of Ramadan.\" She said, \n\"Allah's Messenger (ﷺ) never exceeded eleven rak`at in Ramadan or in other months; he used to offer four \nrak`at-- do not ask me about their beauty and length, then four rak`at, do not ask me about their beauty \nand length, and then three rak`at.\" Aisha further said, \"I said, 'O Allah's Messenger (ﷺ)! Do you sleep before \noffering the witr prayer?' He replied, 'O `Aisha! My eyes sleep but my heart remains awake'!\"", "ch": 19, "ch_en": "Prayer at Night (Tahajjud)", "ch_ar": "كتاب التهجد"}, "bukhari:2855": {"ar": "حَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، عَنْ عُقَيْلٍ، عَنِ ابْنِ شِهَابٍ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏\n\"‏ بُعِثْتُ بِجَوَامِعِ الْكَلِمِ، وَنُصِرْتُ بِالرُّعْبِ، فَبَيْنَا أَنَا نَائِمٌ أُتِيتُ بِمَفَاتِيحِ خَزَائِنِ الأَرْضِ، فَوُضِعَتْ فِي يَدِي ‏\"‏‏.‏ قَالَ أَبُو هُرَيْرَةَ وَقَدْ ذَهَبَ رَسُولُ اللَّهِ صلى الله عليه وسلم وَأَنْتُمْ تَنْتَثِلُونَهَا‏.‏", "narrator": "Narrated Abu Huraira:", "en": "Allah's Messenger (ﷺ) said, \"I have been sent with the shortest expressions bearing the widest meanings, and I have been made victorious with awe (cast in the hearts of the enemy), and while I was sleeping, the keys of the treasures of the world were brought to me and put in my hand.\" \nAbu Huraira added: Allah's Messenger (ﷺ) has left the world and now you, people, are bringing out those treasures (i.e. the Prophet (ﷺ) did not benefit by them).", "ch": 56, "ch_en": "Fighting for the Cause of Allah (Jihaad)", "ch_ar": "كتاب الجهاد والسير"}, "bukhari:2887": {"ar": "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا يَعْقُوبُ بْنُ عَبْدِ الرَّحْمَنِ بْنِ مُحَمَّدِ بْنِ عَبْدِ اللَّهِ بْنِ عَبْدٍ الْقَارِيُّ، عَنْ أَبِي حَازِمٍ، قَالَ أَخْبَرَنِي سَهْلٌ ـ رضى الله عنه يَعْنِي ابْنَ سَعْدٍ ـ قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم يَوْمَ خَيْبَرَ ‏\"‏ لأُعْطِيَنَّ الرَّايَةَ غَدًا رَجُلاً يُفْتَحُ عَلَى يَدَيْهِ، يُحِبُّ اللَّهَ وَرَسُولَهُ، وَيُحِبُّهُ اللَّهُ وَرَسُولُهُ ‏\"‏‏.‏ فَبَاتَ النَّاسُ لَيْلَتَهُمْ أَيُّهُمْ يُعْطَى فَغَدَوْا كُلُّهُمْ يَرْجُوهُ فَقَالَ ‏\"‏ أَيْنَ عَلِيٌّ ‏\"‏‏.‏ فَقِيلَ يَشْتَكِي عَيْنَيْهِ، فَبَصَقَ فِي عَيْنَيْهِ وَدَعَا لَهُ، فَبَرَأَ كَأَنْ لَمْ يَكُنْ بِهِ وَجَعٌ، فَأَعْطَاهُ فَقَالَ أُقَاتِلُهُمْ حَتَّى يَكُونُوا مِثْلَنَا‏.‏ فَقَالَ ‏\"‏ انْفُذْ عَلَى رِسْلِكَ حَتَّى تَنْزِلَ بِسَاحَتِهِمْ، ثُمَّ ادْعُهُمْ إِلَى الإِسْلاَمِ، وَأَخْبِرْهُمْ بِمَا يَجِبُ عَلَيْهِمْ، فَوَاللَّهِ لأَنْ يَهْدِيَ اللَّهُ بِكَ رَجُلاً خَيْرٌ لَكَ مِنْ أَنْ يَكُونَ لَكَ حُمْرُ النَّعَمِ ‏\"‏‏.‏", "narrator": "Narrated Sahl:", "en": "On the day (of the battle) of Khaibar the Prophet (ﷺ) said, \"Tomorrow I will give the flag to somebody \nwho will be given victory (by Allah) and who loves Allah and His Apostle and is loved by Allah and \nHis Apostle.\" So, the people wondered all that night as to who would receive the flag and in the \nmorning everyone hoped that he would be that person. Allah's Messenger (ﷺ) asked, \"Where is `Ali?\" He \nwas told that `Ali was suffering from eye-trouble, so he applied saliva to his eyes and invoked Allah \nto cure him. He at once got cured as if he had no ailment. The Prophet (ﷺ) gave him the flag. `Ali said, \n\"Should I fight them till they become like us (i.e. Muslim)?\" The Prophet (ﷺ) said, \"Go to them patiently \nand calmly till you enter the land. Then, invite them to Islam, and inform them what is enjoined upon \nthem, for, by Allah, if Allah gives guidance to somebody through you, it is better for you than \npossessing red camels.\"", "ch": 56, "ch_en": "Fighting for the Cause of Allah (Jihaad)", "ch_ar": "كتاب الجهاد والسير"}, "bukhari:3390": {"ar": "حَدَّثَنِي إِسْحَاقُ، أَخْبَرَنَا الْفَضْلُ بْنُ مُوسَى، عَنِ الْجُعَيْدِ بْنِ عَبْدِ الرَّحْمَنِ، رَأَيْتُ السَّائِبَ بْنَ يَزِيدَ ابْنَ أَرْبَعٍ وَتِسْعِينَ جَلْدًا مُعْتَدِلاً فَقَالَ قَدْ عَلِمْتُ مَا مُتِّعْتُ بِهِ سَمْعِي وَبَصَرِي إِلاَّ بِدُعَاءِ رَسُولِ اللَّهِ صلى الله عليه وسلم، إِنَّ خَالَتِي ذَهَبَتْ بِي إِلَيْهِ فَقَالَتْ يَا رَسُولَ اللَّهِ إِنَّ ابْنَ أُخْتِي شَاكٍ فَادْعُ اللَّهَ‏.‏ قَالَ فَدَعَا لِي‏.‏", "narrator": "Narrated Al-Ju'aid bin `Abdur Rahman:", "en": "I saw As-Sa'ib bin Yazid when he was ninety-four years old, quite strong and of straight figure. He \nsaid, \"I know that I enjoyed my hearing and seeing powers only because of the invocat
